const ROUTES = {
  home:scrHome, myAccounts:scrMyAccounts, newGroupType:scrNewGroupType,
  newExpenseGroup:scrNewExpenseGroup, newCollecta:scrNewCollecta, newRecurrent:scrNewRecurrent,
  created:scrCreated, group:scrGroup, addExpense:scrAddExpense, expense:scrExpense, period:scrPeriod,
  pay:scrPay, payConfirm:scrPayConfirm, receipt:scrReceipt, externalOk:scrExternalOk,
  config:scrConfig, cfgOptions:scrCfgOptions, cfgAdmins:scrCfgAdmins, addAdmin:scrAddAdmin, cfgAccount:scrCfgAccount,
  selectAccount:scrSelectAccount, join:scrJoin, joinSent:scrJoinSent, joined:scrJoined,
  scan:scrScan, simulate:scrSimulate, archived:scrArchived, info:scrInfo
};
function render(anim, keepScroll){
  const prevScroll = keepScroll ? (document.getElementById('scrollBody')||{}).scrollTop : 0;
  const modalEl = keepScroll ? document.querySelector('.sheet,.dialog') : null;
  const prevModalScroll = modalEl ? modalEl.scrollTop : 0;
  const fn = ROUTES[state.route] || scrHome;
  let html = fn();
  if(anim) html = html.replace('class="screen"','class="screen '+anim+'"');
  vp().innerHTML = html + renderModal() + (state.toast?'<div class="toast">'+esc(state.toast)+'</div>':'');
  if(keepScroll){
    const sb=document.getElementById('scrollBody'); if(sb) sb.scrollTop=prevScroll;
    if(prevModalScroll){ const m=document.querySelector('.sheet,.dialog'); if(m) m.scrollTop=prevModalScroll; }
  }
  if(state.focusJoin){
    state.focusJoin = null;
    const el = document.querySelector('[data-bind="joinName"]');
    if(el) el.focus();
  }
  if(state.focusId){
    const el = document.querySelector('[data-person="'+state.focusId+'"]');
    state.focusId = null;
    if(el){ el.focus(); if(el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  }
}

/* ---------- Eventos ---------- */
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.bind){
    let v=t.value;
    if(t.dataset.money){
      /* Se limpia el propio campo en el momento: las letras no llegan a verse */
      v = sanitizeMoney(v);
      const agrupado = moneyInput(v);
      if(t.value !== agrupado){
        t.value = agrupado;
        const n = agrupado.length;
        try{ t.setSelectionRange(n,n); }catch(_){}
      }
    }
    state.form[t.dataset.bind]= v;
    /* re-render diferido solo para campos que afectan CTA/cálculos */
    const needs=['name','perPerson','amount','title','joinName','note','extNote','adminQuery'];
    if(needs.includes(t.dataset.bind)){
      clearTimeout(window.__db);
      window.__db=setTimeout(()=>{ const pos=t.selectionStart; render(null,true);
        const el=document.querySelector('[data-bind="'+t.dataset.bind+'"]');
        if(el){ el.focus();
          /* en montos el texto se reformatea, así que el cursor va al final */
          const p = t.dataset.money ? (el.value||'').length : pos;
          try{el.setSelectionRange(p,p);}catch(_){} } },420);
    }
  }
  if(t.dataset.bind==='extNote' && state.ext){ state.ext.note = t.value; }
  if(t.dataset.person){
    const p = (state.form.people||[]).find(x=>x.id===t.dataset.person);
    if(p) p.name = t.value;            /* sin re-render: no cambia nada más en pantalla */
  }
  if(t.dataset.custom){
    /* Al escribir un monto, ese queda fijo y el resto se reparte solo */
    const v = sanitizeMoney(t.value);
    const agrupado = moneyInput(v);
    if(t.value !== agrupado){
      t.value = agrupado;
      const n = agrupado.length;
      try{ t.setSelectionRange(n,n); }catch(_){}
    }
    state.form.custom = state.form.custom||{};
    state.form.locked = state.form.locked||{};
    state.form.custom[t.dataset.custom] = Number(v)||0;
    state.form.locked[t.dataset.custom] = true;
    const quien = t.dataset.custom;
    clearTimeout(window.__dbSplit);
    window.__dbSplit = setTimeout(()=>{
      render(null,true);
      const el = document.querySelector('[data-custom="'+quien+'"]');
      if(el){ el.focus(); const n=(el.value||'').length; try{el.setSelectionRange(n,n);}catch(_){} }
    }, 380);
  }
  if(t.dataset.adj){
    state.__adj = state.__adj||{};
    state.__adj[t.dataset.adj] = Number(t.value)||0;
  }
});

document.addEventListener('focusout', e=>{
  const t = e.target;
  if(!t || !t.dataset) return;

  /* Al terminar de escribir, el monto se normaliza a dos decimales */
  if(t.dataset.money && t.dataset.bind){
    const v = sanitizeMoney(state.form[t.dataset.bind]);
    state.form[t.dataset.bind] = (v === '' || isNaN(Number(v))) ? '' : round2(v).toFixed(2);
    render(null, true);
    return;
  }

  /* Un participante que queda sin nombre se retira, para no acumular
     casillas vacías. La mía nunca se quita. */
  if(t.dataset.person && t.dataset.person !== ME){
    const p = (state.form.people||[]).find(x=>x.id===t.dataset.person);
    if(p && !(p.name||'').trim()){
      state.form.people = state.form.people.filter(x=>x.id!==p.id);
      render(null, true);
    }
  }
});

document.addEventListener('click', e=>{
  /* Escribir dentro de un campo no dispara la acción de la fila que lo contiene */
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-a]');
  if(!el){ return; }
  const a = el.dataset.a;
  /* Clic dentro de la hoja/diálogo: no cerrar el modal por el scrim */
  if(stop && el.contains(stop)) return;
  const d = el.dataset;
  const gid = d.gid || state.params.gid;

  switch(a){
    case 'back': back(); break;
    case 'home': home(); break;
    case 'closeModal': closeModal(); break;
    case 'acc': {
      const cabecera = document.querySelector('.accordion[data-k="'+d.k+'"]');
      const abierto = state.accordions[d.k] = !(cabecera && cabecera.classList.contains('open'));
      /* Sin repintar: repintar recrearía el nodo y la transición no correría */
      const panel = document.querySelector('.acc-panel[data-acc="'+d.k+'"]');
      if(panel && cabecera){ panel.classList.toggle('open', abierto); cabecera.classList.toggle('open', abierto); }
      else render(null,true);
      break; }
    case 'tab': state.tab=d.t; render(null,true); break;
    case 'myAccounts': go('myAccounts'); break;

    /* Crear grupo */
    case 'newGroup': state.form={}; go('newGroupType'); break;
    case 'pickType':
      state.form={type:d.t, people:[{id:ME, name:person(ME).name}], emoji:null, accountId:null,
        frequency:'Mensual', deadline:todayStr(), payDay:null,
        /* La colecta no muestra el campo; las demás arrancan sin categoría */
        category: d.t==='colecta' ? 'regalos' : null};
      go(d.t==='gastos'?'newExpenseGroup':(d.t==='colecta'?'newCollecta':'newRecurrent'));
      break;
    case 'pickEmoji': openModal({type:'emoji'}); break;
    case 'setEmoji': state.form.emoji=d.v; closeModal(); break;
    case 'pickCategory': openModal({type:'category'}); break;
    case 'setCategory':
      state.form.category=d.v;
      if(state.route==='addExpense') state.form.emoji=catOf(d.v).e;
      closeModal(); break;
    case 'pickDayOfMonth': openModal({type:'dayOfMonth'}); break;
    case 'setDayOfMonth': state.form.payDay=parseInt(d.v,10); closeModal(); break;
    case 'pickDate': {
      const cur = state.form[d.f] || todayStr();
      state.calSel = cur; state.calInit = cur;
      state.calMonth = monthOf(cur); state.calYear = yearOf(cur);
      openModal({type:'date', f:d.f}); break; }
    case 'calPrev': {
      let m=(state.calMonth==null?new Date().getMonth():state.calMonth)-1;
      let y=(state.calYear==null?new Date().getFullYear():state.calYear);
      if(m<0){ m=11; y--; }
      state.calMonth=m; state.calYear=y; render(null,true); break; }
    case 'calNext': {
      let m=(state.calMonth==null?new Date().getMonth():state.calMonth)+1;
      let y=(state.calYear==null?new Date().getFullYear():state.calYear);
      if(m>11){ m=0; y++; }
      state.calMonth=m; state.calYear=y; render(null,true); break; }
    case 'calPick': state.calSel=d.v; render(null,true); break;
    case 'calReset':
      state.calSel = state.calInit || todayStr();
      state.calMonth = monthOf(state.calSel); state.calYear = yearOf(state.calSel);
      render(null,true); break;
    case 'calApply': if(state.calSel){ state.form[d.f]=state.calSel; } closeModal(); break;
    case 'addMember': {
      state.form.people = state.form.people || [{id:ME, name:person(ME).name}];
      /* Si ya hay una casilla vacía, no se crea otra: se enfoca esa */
      const vacia = state.form.people.find(p=>p.id!==ME && !(p.name||'').trim());
      if(vacia){ state.focusId = vacia.id; render(null,true); break; }
      const id = uid('u');
      state.form.people.push({id:id, name:''});
      state.focusId = id;
      render(null,true); break; }
    case 'clearMember': {
      const p = (state.form.people||[]).find(x=>x.id===d.id);
      if(p) p.name = '';
      state.focusId = d.id;             /* el cursor se queda en el campo */
      render(null,true); break; }
    case 'pickAccount': go('selectAccount',{for:d.for, gid:state.params.gid}); break;
    case 'setAccount':
      if(d.for==='pay') state.pay.accountId=d.id; else state.form.accountId=d.id;
      back(); break;
    case 'createGroup': createGroup(); break;

    /* Grupo */
    case 'openGroup': state.tab='gastos'; go('group',{gid:d.id}); break;
    case 'openGroupReplace': state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='gastos'; go('group',{gid:d.id},{replace:true}); break;
    case 'openPending': go('group',{gid:d.id}); break;
    case 'config': go('config',{gid:d.id}); break;
    case 'shareModal': openModal({type:'share', gid:d.id}); break;
    case 'shareLink': closeModal(); toast('Enlace copiado al portapapeles'); break;

    /* Gastos */
    case 'addExpense': {
      const gr=g(gid); const who={}; gr.members.forEach(m=>who[m]=true);
      state.form={who:who, paidBy:ME, splitMode:'iguales', date:todayStr(), accountId:null, custom:{}};
      go('addExpense',{gid:gid}); break; }
    case 'toggleWho':
      state.form.who[d.id] = !state.form.who[d.id];
      if(state.form.locked) delete state.form.locked[d.id];   /* deja de contar como fijo */
      render(null,true); break;
    case 'pickPayer': openModal({type:'payer'}); break;
    case 'setPayer': state.form.paidBy=d.v; closeModal(); break;
    case 'pickSplit': openModal({type:'splitmode'}); break;
    case 'setSplit':
      state.form.splitMode=d.v;
      state.form.locked={}; state.form.custom={};   /* empezar el reparto de cero */
      closeModal(); break;
    case 'resetSplit':
      state.form.locked={}; state.form.custom={};
      render(null,true); break;
    case 'saveExpense': saveExpense(gid); break;
    case 'openExpense': go('expense',{gid:d.gid, eid:d.eid}); break;
    case 'openPeriod': go('period',{gid:d.gid, pid:d.pid}); break;
    case 'adjustSplit': state.__adj=null; openModal({type:'adjust', gid:gid}); break;
    case 'saveAdjust': {
      const gr=g(gid); if(state.__adj){ gr.periods.forEach(p=>{ Object.entries(state.__adj).forEach(([m,v])=>{ if(!p.paid[m]) p.split[m]=round2(v); }); }); }
      closeModal(); toast('Montos actualizados'); break; }

    /* Pagos */
    case 'payGroup': {
      const gr=g(d.gid); const items=myDues(gr);
      if(!items.length) break;
      state.pay={items:items, total:round2(items.reduce((s,x)=>s+x.amount,0)),
        multi:items.length>1, accountId:null, motivo:gr.name};
      go('pay'); break; }
    case 'payAll': {
      const items=allDues();
      state.pay={items:items, total:totalDue(), multi:true, accountId:null, motivo:'Grupos de pago — balance total'};
      go('pay'); break; }
    case 'payItem': {
      const gr=g(gid); let item;
      if(d.kind==='gasto'){ const e=gr.expenses.find(x=>x.id===d.id);
        item={gid:gr.id,id:e.id,kind:'gasto',title:e.title,amount:e.split[ME],to:e.paidBy}; }
      else if(d.kind==='colecta'){ item={gid:gr.id,id:'colecta',kind:'colecta',title:'Aporte a '+gr.name,amount:gr.perPerson,to:gr.owner}; }
      else { const p=gr.periods.find(x=>x.id===d.id);
        item={gid:gr.id,id:p.id,kind:'recurrente',title:gr.name+' — '+p.label,amount:p.split[ME],to:gr.owner}; }
      state.pay={items:[item], total:item.amount, accountId:null, motivo:item.title+' ('+gr.name+')'};
      go('pay'); break; }
    case 'payReview':
      state.pay.fecha='8 jul 2026';
      state.pay.ref='PG-'+Math.floor(100000+Math.random()*899999);
      go('payConfirm'); break;
    case 'payDo':
      if(state.pay.loading) break;
      state.pay.loading = true;
      render(null,true);
      clearTimeout(window.__payT);
      window.__payT = setTimeout(()=>{
        if(state.route!=='payConfirm' || !state.pay.loading) return;  /* si salió, no se cobra */
        state.pay.loading = false;
        applyPayment();
        go('receipt',{},{replace:true});
      }, 1900);
      break;
    case 'shareReceipt': toast('Comprobante compartido'); break;
    case 'clearJoinName': state.form.joinName=''; state.focusJoin=true; render(null,true); break;
    case 'payDone': {
      const gid2 = state.pay.items && state.pay.items.length===1 ? state.pay.items[0].gid : null;
      if(gid2){ state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='balances'; go('group',{gid:gid2},{replace:true}); }
      else home();
      break; }

    /* Pago externo */
    case 'memberOptions': openModal({type:'memberOptions', gid:d.gid, id:d.id}); break;
    case 'openExternal': {
      const gr=g(d.gid);
      /* El monto sale de lo que esa persona debe */
      state.ext = {gid:d.gid, memberId:d.id, amount:owedBy(gr, d.id), method:'efectivo', note:''};
      openModal({type:'externalForm'}); break; }
    case 'saveExternal': saveExternal(); break;
    case 'externalDone':
      state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='balances';
      go('group',{gid:d.gid},{replace:true}); break;

    /* Configuración */
    case 'cfgAdmins': go('cfgAdmins',{gid:gid}); break;
    case 'goAddAdmin': state.form={adminQuery:''}; go('addAdmin',{gid:d.gid}); break;
    case 'cfgAdd': go('cfgOptions',{gid:gid, kind:'add'}); break;
    case 'cfgJoin': go('cfgOptions',{gid:gid, kind:'join'}); break;
    case 'cfgInvite': go('cfgOptions',{gid:gid, kind:'invite'}); break;
    case 'cfgAccount': go('cfgAccount',{gid:gid}); break;
    case 'setPerm': { const gr=g(gid); gr.perms[d.key]=d.val; render(null,true); toast('Configuración actualizada'); break; }
    case 'setGroupAccount': { const gr=g(gid); gr.accountId=d.id; render(null,true); toast('Cuenta actualizada'); break; }
    case 'askAdmin': openModal({type:'confirmAdmin', gid:gid, id:d.id}); break;
    case 'doAdmin': { const gr=g(d.gid); if(!gr.admins.includes(d.id)) gr.admins.push(d.id);
      state.modal=null; state.form={adminQuery:''}; back(); toast('Administrador agregado'); break; }
    case 'rmAdmin': { const gr=g(gid); gr.admins=gr.admins.filter(x=>x!==d.id); render(null,true); toast('Administrador removido'); break; }
    case 'archiveGroup': openModal({type:'confirmArchive', gid:gid}); break;
    case 'doArchive': { const gr=g(gid); gr.archived=!gr.archived; closeModal();
      toast(gr.archived?'Grupo archivado':'Grupo reabierto'); if(gr.archived) home(); break; }

    /* Solicitudes: siempre se confirma antes de ejecutar la acción */
    case 'approveReq': openModal({type:'confirmReq', gid:d.gid, rid:d.rid, mode:'accept'}); break;
    case 'rejectReq':  openModal({type:'confirmReq', gid:d.gid, rid:d.rid, mode:'reject'}); break;
    case 'doReq': {
      const gr=g(d.gid); const r=gr.requests.find(x=>x.id===d.rid);
      if(!r){ closeModal(); break; }
      gr.requests=gr.requests.filter(x=>x.id!==d.rid);
      if(d.mode==='accept'){
        let newId = Object.keys(PEOPLE).find(k=>PEOPLE[k].name===r.userName);
        if(!newId){ newId=uid('u'); PEOPLE[newId]={id:newId, name:r.userName, full:r.full, short:r.userName.split(' ')[0]}; }
        if(!gr.members.includes(newId)){
          gr.members.push(newId);
          if(gr.type==='colecta') gr.contributions[newId]=false;
          if(gr.type==='recurrente') gr.periods.forEach(p=>{ p.split[newId]=round2(gr.amount/gr.members.length); p.paid[newId]=false; });
        }
        openModal({type:'approved', who:r.userName, gname:gr.name});
      } else {
        openModal({type:'rejected', who:r.userName, gname:gr.name});
      }
      break; }

    /* Unirse */
    case 'joinQR': state.scan='buscando'; go('scan',{gid:'s2'}); startScan(); break;
    case 'scanNow': scanDetect(); break;
    case 'goInfo': go('info'); break;
    case 'goArchived': go('archived'); break;
    case 'goSimulate': go('simulate'); break;
    case 'simInvite': state.form={}; go('join',{gid:d.gid||'s1'}); break;
    case 'simRequest': {
      const gr=g(d.gid); if(!gr) break;
      const quien = Object.values(PEOPLE).find(p=>p.id!==ME && !gr.members.includes(p.id))
        || {name:'María Gómez', full:'MARÍA ALTAGRACIA GÓMEZ REYES'};
      gr.requests.push({id:uid('r'), userName:quien.name, full:quien.full});
      home(); toast(quien.name+' pidió unirse a “'+gr.name+'”');
      break; }
    case 'pickSlot':
      state.form.joinPick = (state.form.joinPick===d.id ? null : d.id);
      state.form.joinName = '';
      render(null,true); break;
    case 'customName':
      state.form.joinPick = null; state.form.joinName = '';
      openModal({type:'customName', gid:gid}); break;
    case 'doJoin': doJoin(d.gid||gid); break;
    default: break;
  }
});

/* ---------- Acciones ---------- */
/* Registra en la agenda los nombres escritos a mano y devuelve los ids de los miembros */
function commitPeople(list){
  const out = [];
  (list||[]).forEach(p=>{
    const isMe = p.id===ME;
    const nm = (p.name||'').trim() || (isMe ? person(ME).name : '');
    if(!nm) return;                       /* se descartan los campos vacíos */
    const short = nm.split(' ')[0];
    PEOPLE[p.id] = {id:p.id, name:nm, short:short, full:(PEOPLE[p.id]&&PEOPLE[p.id].name===nm)
      ? PEOPLE[p.id].full : nm.toUpperCase()};
    out.push(p.id);
  });
  if(!out.includes(ME)) out.unshift(ME);
  return out;
}

/* Próxima ocurrencia de ese día del mes, ajustando los meses cortos */
function nextDateFor(dia){
  const hoy = new Date();
  let y = hoy.getFullYear(), m = hoy.getMonth();
  if(hoy.getDate() >= dia){ m++; if(m>11){ m=0; y++; } }
  const ultimo = new Date(y, m+1, 0).getDate();
  return Math.min(dia, ultimo)+'/'+MONTHS[m]+'/'+y;
}

function createGroup(){
  const f = state.form;
  const id = uid('g');
  const base = {
    id:id, type:f.type, emoji:f.emoji||'🎉', name:f.name.trim(), category:f.category||'otros',
    owner:ME, admins:[ME], members:commitPeople(f.people),
    accountId: f.type==='gastos' ? null : f.accountId,
    archived:false, requests:[],
    perms:{addExpense:'todos', join:'aprobacion', invite:'todos'}
  };
  if(f.type==='gastos'){ base.expenses=[]; }
  if(f.type==='colecta'){
    base.perPerson=round2(f.perPerson); base.deadline=f.deadline;
    base.contributions={}; base.members.forEach(m=>base.contributions[m]=false);
  }
  if(f.type==='recurrente'){
    base.amount=round2(f.amount);
    base.frequency='Mensual';               /* por ahora solo mensual */
    base.payDay=f.payDay;
    base.nextDate=nextDateFor(f.payDay);
    const per = round2(base.amount/base.members.length);
    const split={}, paid={}; base.members.forEach(m=>{split[m]=per; paid[m]=false;});
    const mes = MONTHS_L[MONTHS.indexOf(base.nextDate.split('/')[1])].toLowerCase();
    base.periods=[{id:uid('p'), label:'Mes de '+mes, due:base.nextDate, split:split, paid:paid}];
  }
  state.groups.push(base);
  state.stack=[{route:'home',params:{},tab:'gastos'}];
  go('created',{gid:id},{replace:true, up:true});
}

function saveExpense(gid){
  const gr=g(gid); const f=state.form;
  const amt = round2(f.amount);
  const act = gr.members.filter(m=>f.who[m]);
  const split = splitAmounts(gr);
  const paid = {};
  act.forEach(m=> paid[m] = (m===(f.paidBy||ME)));
  gr.expenses.push({id:uid('e'), title:f.title.trim(), emoji:f.category?catOf(f.category).e:'🧾',
    category:f.category||'otros', amount:amt, paidBy:f.paidBy||ME, date:f.date, split:split, paid:paid});
  state.tab='gastos';
  back();
  toast('Gasto agregado con éxito: “'+f.title.trim()+'”');
}

function applyPayment(){
  (state.pay.items||[]).forEach(it=>{
    const gr=g(it.gid); if(!gr) return;
    if(it.kind==='gasto'){ const e=gr.expenses.find(x=>x.id===it.id); if(e) e.paid[ME]=true; }
    if(it.kind==='colecta'){ gr.contributions[ME]=true; }
    if(it.kind==='recurrente'){ const p=gr.periods.find(x=>x.id===it.id); if(p) p.paid[ME]=true; }
  });
  const a = acct(state.pay.accountId); a.avail = round2(a.avail - state.pay.total);
}

/* Marca como saldado lo que ese participante debía dentro del grupo */
function saveExternal(){
  const e = state.ext; if(!e) return;
  const gr = g(e.gid); if(!gr) return;
  if(gr.type==='colecta'){ gr.contributions[e.memberId] = true; }
  else if(gr.type==='recurrente'){
    const p = gr.periods.find(x=>!x.paid[e.memberId]); if(p) p.paid[e.memberId] = true;
  } else {
    gr.expenses.forEach(x=>{
      if(x.paidBy !== e.memberId && x.split[e.memberId] && !x.paid[e.memberId]) x.paid[e.memberId] = true;
    });
  }
  state.stack = [{route:'home',params:{},tab:'gastos'}];
  state.modal = null;
  go('externalOk', {}, {replace:true, up:true});
}

/* Reclamar un nombre ya creado: hereda su historial dentro del grupo */
function claimSlot(gr, slotId){
  const mover = o => { if(o && o[slotId]!==undefined){ o[ME] = o[slotId]; delete o[slotId]; } };
  gr.members = gr.members.map(m => m===slotId ? ME : m);
  (gr.expenses||[]).forEach(e=>{ if(e.paidBy===slotId) e.paidBy = ME; mover(e.split); mover(e.paid); });
  if(gr.contributions) mover(gr.contributions);
  (gr.periods||[]).forEach(p=>{ mover(p.split); mover(p.paid); });
  gr.admins = gr.admins.map(m => m===slotId ? ME : m);
  gr.unclaimed = (gr.unclaimed||[]).filter(x => x!==slotId);
}

function doJoin(gid){
  const gr=g(gid); const direct = gr.perms.join==='enlace';
  const pick = state.form.joinPick;
  const nm = (state.form.joinName||'').trim();
  if(direct){
    if(pick){ claimSlot(gr, pick); }
    else if(!gr.members.includes(ME)) gr.members.push(ME);
    if(gr.type==='colecta') gr.contributions[ME]=false;
    if(gr.type==='recurrente') gr.periods.forEach(p=>{ if(p.split[ME]==null){ p.split[ME]=round2(gr.amount/(gr.members.length)); p.paid[ME]=false; } });
    state.stack=[{route:'home',params:{},tab:'gastos'}];
    go('joined',{gid:gid},{replace:true, up:true});
  } else {
    const quien = pick ? person(pick).name : nm;
    gr.requests.push({id:uid('r'), userName:quien, full:quien.toUpperCase()});
    state.stack=[{route:'home',params:{},tab:'gastos'}];
    go('joinSent',{gid:gid},{replace:true, up:true});
  }
}

render();
</script>
