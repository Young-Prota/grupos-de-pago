<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupos de pago · Banco Popular (Prototipo UX)</title>
<!-- Inter (opcional). Si no hay conexión, cae al stack local sin romper nada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Neo Sans = tipografía de marca (títulos, montos, CTA).
     Inter    = tipografía de interfaz (cuerpo, etiquetas, campos).
     Neo Sans es una fuente licenciada: si está instalada en el equipo se usa,
     si no, el stack cae a Inter y luego a la del sistema. */
  --font-display:'Neo Sans','Neo Sans Pro','NeoSansStd','Neo Sans Std','Neo Sans Medium',
                 'Inter','Inter Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-ui:'Inter','Inter Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --orange:#ED8B00;
  --orange-d:#C97600;
  --orange-l:#FDF6EC;
  --navy:#002E6D;
  --navy-2:#0B3D91;
  --ink:#3D4A5C;
  --ink-2:#5A6879;
  --muted:#8C96A3;
  --line:#E6E8EB;
  --line-2:#F1F2F4;
  --chip:#E9F2FB;
  --sel:#FDF8F1;
  --field-focus:#FEFAF1;
  --teal:#0F6F91;
  --green:#0E7C5A;
  --red:#C0392B;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-2:0 8px 28px rgba(16,24,40,.14);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui);
  font-feature-settings:"cv05" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;
  background:#EEF1F5;
  color:var(--ink);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
}
button{font-family:inherit}
input,textarea,select{font-family:var(--font-ui)}

/* ===== Jerarquía tipográfica =====
   Neo Sans para la voz de marca: títulos de pantalla, nombres, montos y CTA.
   Inter para todo lo demás: cuerpo, etiquetas, campos y textos de apoyo. */
h2.t, .section-title, .sec-nav, .success h2,
.sheet h3,
.totalcard .v, .amt, .chip, .receipt-k, .balrow .who .a, .accordion .l,
.brandbar, .qrcard .qt, .info-line .v, .mrow .nm, .splitrow .val{
  font-family:var(--font-display);
}
.success h2, .sheet h3{letter-spacing:-.015em}
.chip{letter-spacing:.005em}

/* ===== Marco de teléfono ===== */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.brandbar{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:800;font-size:14px;letter-spacing:.2px}
.brandbar .dot{width:22px;height:22px;border-radius:6px;background:var(--orange);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.brandbar small{font-weight:600;color:var(--muted);letter-spacing:0}
.phone{
  width:390px;height:844px;background:#fff;border-radius:46px;
  box-shadow:0 0 0 11px #12161c,0 0 0 13px #2a3038,0 30px 60px rgba(0,0,0,.28);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.statusbar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:800;color:#111}
.statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9}
.statusbar svg{display:block}
.viewport{flex:1;position:relative;overflow:hidden}

/* ===== Screen ===== */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.screen.enter{animation:slideIn .26s cubic-bezier(.22,.61,.36,1)}
.screen.enter-back{animation:slideBack .26s cubic-bezier(.22,.61,.36,1)}
.screen.enter-up{animation:slideUp .28s cubic-bezier(.22,.61,.36,1)}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

.nav{flex:0 0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 16px 8px}
/* Page header: Inter regular 16 */
.nav h1{grid-column:2;text-align:center;margin:0;
  font-family:var(--font-ui);font-size:16px;font-weight:400;color:var(--navy)}
.nav button{background:none;border:0;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--orange);border-radius:10px}
.nav button:active{background:var(--orange-l)}
.nav .right{grid-column:3;justify-self:end}
.nav .with-dot{position:relative;overflow:visible}
.dot-count{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;
  background:var(--orange);color:#fff;border:2px solid #fff;padding:0 4px;
  font-family:var(--font-ui);font-size:10px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 24px 24px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}
.footer{flex:0 0 auto;padding:16px 24px 24px;background:#fff;border-top:1px solid transparent}
.footer.bordered{border-top:1px solid var(--line-2)}

/* ===== Tipografía ===== */
/* Encabezados de sección: Neo Sans bold 16, separados 16 arriba y abajo */
h2.t{font-size:16px;font-weight:700;color:var(--navy);margin:16px 0}
/* Encabezado de pantalla de selección: Inter semibold 16 */
h2.t.ui{font-family:var(--font-ui);font-size:16px;font-weight:600}
.section-title{font-size:16px;font-weight:700;color:#37424F;margin:16px 0}
p.sub{margin:0 0 16px;color:var(--ink-2);font-family:var(--font-ui);font-size:16px;font-weight:400;line-height:1.45}
.sec-nav{font-size:16px;font-weight:700;color:var(--navy);margin:16px 0 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}

/* ===== Botones ===== */
/* ===== Botones — medidas del Figma =====
   Largo ............ 342 × 56  (ancho completo con los 24 de margen lateral)
   Largo en pop-up .. 296 × 48  (ancho completo dentro del diálogo)
   Mediano .......... 268 × 48  (.btn-md, centrado)
   Par pequeño ...... 148 × 48  (.btn-sm)
   Texto: Inter 16 bold */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:56px;padding:0 16px;border:0;border-radius:var(--r);
  font-family:var(--font-ui);font-size:16px;font-weight:700;line-height:1.25;text-align:center;
  cursor:pointer;transition:transform .08s,filter .15s}
.sheet .btn,.dialog .btn{min-height:48px}
.btn-md{width:268px;max-width:100%;min-height:48px;margin-left:auto;margin-right:auto}
.btn-sm{width:148px;max-width:100%;min-height:48px}
.btn-xs{width:auto;min-height:40px;padding:0 16px;font-size:14px;font-weight:700;border-radius:10px}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{filter:brightness(1.04)}
.btn-primary[disabled],.btn[disabled]{background:#F1F2F4;color:#9AA3AE;cursor:not-allowed}
.btn-soft{background:var(--chip);color:#2B3A4A}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-danger{background:#FDECEA;color:var(--red)}
/* Separación solo entre botones apilados verticalmente.
   Con ">" queda restringida a los botones sueltos del footer / hoja / diálogo,
   así nunca afecta a filas horizontales (Restaurar-Aplicar, Rechazar-Aprobar),
   donde el margen superior le restaría alto al segundo botón. */
.footer>.btn+.btn,.sheet>.btn+.btn,.dialog>.btn+.btn{margin-top:8px}

/* ===== Inputs ===== */
/* 24 y no 16: el label flotante se come parte de la separación */
.field{position:relative;margin-bottom:24px}
/* Label flotante sobre el borde. Mismo tratamiento en campos de texto y en
   los campos tipo "select" (fecha, categoría, frecuencia). */
.field .lab,.select-like .lab{position:absolute;top:-7px;left:8px;background:#fff;padding:0 8px;
  font-family:var(--font-ui);font-size:12px;font-weight:400;color:#3D4558;
  line-height:16px;pointer-events:none}
.field:focus-within .lab,.select-like:focus-within .lab{background:var(--field-focus)}
/* Campo de texto: 48 de alto. El botón de emoji lo acompaña en 48x48. */
.inp{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 16px;
  font-size:16.5px;color:#37424F;background:#fff;outline:none;font-family:inherit}
textarea.inp{height:auto;min-height:96px;padding:16px}
.inp::placeholder{color:#A9B1BB}
/* Estado de foco de cualquier campo de texto */
.inp:focus,.splitmini:focus{border-color:var(--orange);background:var(--field-focus)}
.select-like:focus-visible{border-color:var(--orange);background:var(--field-focus);outline:none}

/* Campo de monto: el "RD$" es fijo y el usuario escribe después */
.field.money .prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:16.5px;color:#37424F;pointer-events:none}
.field.money .inp{padding-left:56px}

/* Participantes: mismo campo que "Tu nombre" al unirse, pero sin label */
.prow{display:flex;align-items:center;gap:8px;width:100%;height:48px;background:#fff;
  border:1.5px solid var(--line);border-radius:var(--r);padding:0 16px;margin-bottom:16px;
  transition:border-color .15s,background .15s}
.prow:focus-within{border-color:var(--orange);background:var(--field-focus)}
.pinput{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;
  font-family:var(--font-ui);font-size:16.5px;color:#37424F}
.pinput::placeholder{color:#A9B1BB}
.prow .rm{flex:0 0 auto;background:none;border:0;padding:0;color:var(--navy);cursor:pointer;display:flex}
.addrow{display:flex;align-items:center;width:100%;height:48px;text-align:left;background:#fff;cursor:pointer;
  border:1.5px solid var(--line);border-radius:var(--r);padding:0 16px;
  font-family:var(--font-ui);font-size:16px;font-weight:500;color:var(--navy)}
.addrow:active{background:#FAFBFC}
.row{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px}
.row>*{flex:1 1 0;min-width:0;width:auto}
/* Par de campos exactamente iguales: las pistas de grid no las estira el contenido */
.row.eq{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.row.eq>*{width:auto;min-width:0}
.emoji-btn{flex:0 0 48px;width:48px;height:48px;color:var(--orange);border:1.5px solid var(--line);border-radius:var(--r);
  background:#fff;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.emoji-btn:active{border-color:var(--orange)}
/* Campo tipo "select": se comporta igual que un campo de texto con label flotante */
.select-like{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;
  padding:0 16px;text-align:left;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--font-ui);font-size:16.5px;color:#37424F;font-weight:400}
.select-like>span:not(.lab){min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.select-like .ph{color:#A9B1BB}
.select-like[disabled]{background:#F7F8FA;color:#8C96A3;cursor:default}
.select-like[disabled] .lab{background:#F7F8FA;color:var(--muted)}
.select-like svg{color:var(--orange);flex:0 0 auto}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card-btn{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:16px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px;margin-bottom:16px}
.card-btn:active{background:#FAFBFC}
.card-btn>span{min-width:0}
.card-btn .ttl{display:block;font-family:var(--font-ui);font-size:16px;font-weight:500;color:var(--navy);line-height:1.3}
.card-btn .txt{display:block;font-family:var(--font-ui);font-size:14px;font-weight:400;color:var(--ink-2);margin-top:4px;line-height:1.35}
.card-btn.plain .ttl{color:#37424F}
.chev{color:var(--orange);flex:0 0 auto}

.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
/* El icono arriba y la etiqueta pegada al fondo: así las de una y dos líneas
   quedan alineadas por abajo. */
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 8px;cursor:pointer;text-align:left;min-height:100px;
  display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.tile:active{background:#FAFBFC}
.tile .ic{color:var(--orange);display:flex}
.tile .ic svg{display:block;width:28px;height:28px}
.tile .lbl{font-family:var(--font-ui);font-size:13px;font-weight:500;color:#37424F;line-height:1.25}

.accordion{border-bottom:1px solid var(--line);padding:16px 4px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:none;width:100%;border-left:0;border-right:0;border-top:0}
.accordion .l{font-size:16px;font-weight:700;color:var(--navy)}
.accordion .r{display:flex;align-items:center;gap:8px}
/* En cero el contador va en durazno; con contenido pasa a naranja */
.badge{min-width:26px;height:26px;border-radius:13px;background:#F7D2AB;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;padding:0 8px}
.badge.on{background:var(--orange);color:#fff}
.badge.navy{background:var(--navy);color:#fff}
/* Acordeón: el panel siempre está en el DOM y se anima con grid-template-rows,
   que sí es interpolable (a diferencia de height:auto). */
.accordion .arrow{display:flex;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.accordion.open .arrow{transform:rotate(180deg)}
.acc-panel{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1), opacity .2s ease}
/* El overflow es necesario para animar el alto, pero recortaba la sombra
   de las tarjetas: se le da aire lateral y se compensa con margen negativo. */
.acc-panel>.inner{overflow:hidden;min-height:0;margin:0 -16px;padding:0 16px 8px}
.acc-panel.open{grid-template-rows:1fr;opacity:1}
@media (prefers-reduced-motion:reduce){
  .acc-panel,.accordion .arrow{transition:none}
}

/* Lista de grupos */
.glist{padding:16px 0 8px;display:flex;flex-direction:column;gap:16px}
.gcard{display:flex;align-items:center;gap:16px;width:100%;height:82px;text-align:left;cursor:pointer;
  background:#fff;border:0;border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.09);padding:0 16px}
.gcard:active{background:#FAFBFC}
.gcard .avatar{flex:0 0 50px;width:50px;height:50px;border-radius:25px;font-size:25px;line-height:1}
.gcard .info{flex:1;min-width:0}
.gcard .nm{display:block;font-family:var(--font-ui);font-size:20px;font-weight:500;color:#3B4559;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .mt{display:block;font-size:15px;color:#7A8593;margin-top:4px}
.avatar{flex:0 0 42px;height:42px;border-radius:21px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:20px}
/* El monto siempre en el mismo color: lo que distingue es el signo */
.amt{font-size:15px;font-weight:800;color:#3D4558;white-space:nowrap}
.amt.pos,.amt.neg,.amt.zero{color:#3D4558}

/* Chips */
.type-chip{text-align:center;margin:16px 0 24px}   /* +8 del padding del body = 24 */
.chip{display:inline-block;background:var(--chip);color:var(--navy);border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600}
.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11.5px;font-weight:800;letter-spacing:.2px}
.pill.paid{background:#E6F5EF;color:var(--green)}
.pill.due{background:#FDECEA;color:var(--red)}
.pill.pend{background:#FDF3E3;color:#8A5B10}

/* Group hero */
.hero{text-align:center;padding:8px 0 4px}
.hero .em{width:64px;height:64px;border-radius:32px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 8px}
/* Nombre del grupo en su pantalla: Inter medium 24 */
.hero h2{margin:0 0 8px;font-family:var(--font-ui);font-size:24px;font-weight:500;
  color:#37424F;letter-spacing:-.01em}

.tabs{display:flex;border-bottom:1px solid var(--line);margin:16px -24px 0;padding:0 24px}
.tabs button{flex:1;background:none;border:0;padding:16px 0 8px;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--orange);border-bottom-color:var(--orange)}

.empty{text-align:center;color:var(--ink-2);font-size:15px;padding:56px 16px}

/* Filas de miembros/split */
.splitbox{border:1.5px solid var(--orange);border-radius:var(--r);overflow:hidden;background:var(--sel)}
.splitrow{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid #F0E4D2;
  cursor:pointer;user-select:none;transition:background .12s}
.splitrow:active{background:#FBF2E4}
.splitrow:last-child{border-bottom:0}
.splitrow .nm{flex:1;font-size:16px;color:#37424F}
.splitrow .val{font-size:16px;color:#37424F;font-weight:600}
.cb{width:26px;height:26px;border-radius:6px;border:2px solid #C9CFD6;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.cb.on{background:var(--orange);border-color:var(--orange);color:#fff}
.splitmini.auto{color:var(--muted)}
.splitnote{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.splitmini{width:96px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;font-size:14.5px;font-family:inherit}

.mrow{display:flex;align-items:center;gap:16px;padding:16px 16px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;background:#fff;box-shadow:var(--shadow)}
.mrow .nm{flex:1;font-size:16px;color:#37424F}
.mrow .nm b{display:block;font-family:var(--font-display);font-size:12px;font-weight:400;color:#012169;text-transform:uppercase;letter-spacing:.3px}
.tag-you{background:var(--orange);color:#fff;border-radius:14px;padding:6px;
  font-family:var(--font-ui);font-size:12px;font-weight:600;line-height:1}
.tag-own{background:var(--orange);color:#fff;border-radius:16px;padding:8px 16px;font-size:14px;font-weight:700;white-space:nowrap}

.balrow{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;background:#fff;box-shadow:var(--shadow)}
.balrow .who{flex:1;min-width:0}
.balrow .who .a{display:block;font-size:15px;font-weight:800;color:var(--navy);text-transform:uppercase}
.balrow .who .b{display:block;font-family:var(--font-display);font-size:12px;font-weight:400;color:#012169;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* El SVG de avatar ya incluye su fondo y su borde */
.ava-ic{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center}
.ava-ic svg{display:block;width:40px;height:40px}

.totalcard{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:center;margin-bottom:8px}
.totalcard .k{font-family:var(--font-display);font-size:16px;font-weight:500;color:#012169}
/* Balance del card de monto: Neo Sans Std Regular 32 */
.totalcard .v{font-family:var(--font-display);font-size:32px;font-weight:400;color:#555555;
  margin-top:8px;letter-spacing:normal}
.totalcard .n{font-size:13px;color:var(--muted);margin-top:4px}
.totalcard.tap{display:block;width:100%;cursor:pointer;background:#fff;transition:background .15s}
.totalcard.tap:active{background:#FAFBFC}
.totalcard.tap .k,.totalcard.tap .v{display:block}
.totalcard.tap .go{display:inline-flex;align-items:center;gap:8px;margin-top:8px;
  font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--orange)}

/* El icono siempre centrado respecto al texto del aviso */
.notice{display:flex;align-items:center;gap:16px;background:#FFFAF1;border-radius:var(--r);padding:16px;font-size:13.5px;color:#3B4559;line-height:1.45;margin-bottom:16px}
.notice svg{flex:0 0 auto;color:#ED8B00}
.info-line{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:15px}
.info-line:last-child{border-bottom:0}
.info-line .k{color:var(--ink-2)}
.info-line .v{color:#37424F;font-weight:700;text-align:right}

.acct{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;margin-bottom:16px}
.acct .n{display:block;font-family:var(--font-ui);font-size:16px;font-weight:500;color:#37424F}
.acct .d{display:block;font-family:var(--font-ui);font-size:14px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.5}
.acct.sel{background:#F5F6F8;border-color:#D9DEE4}
/* Lista de selección de cuenta: filas planas, sin borde ni radio.
   La cuenta activa se marca con un bloque gris claro. */
.acctlist{margin-top:24px}
.acct-row{display:block;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;box-shadow:none;border-radius:8px;padding:16px;margin-bottom:16px}
.acct-row:last-child{margin-bottom:0}
.acct-row .n{display:block;font-family:var(--font-ui);font-size:16px;font-weight:500;color:#37424F;line-height:1.25}
.acct-row .d{display:block;font-family:var(--font-ui);font-size:14px;font-weight:400;color:#7A8593;margin-top:4px;line-height:1.5}
.acct-row.sel{background:#F7F8FA}
.acct-row:not(.sel):active{background:#FBFCFD}

.optrow{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;margin-bottom:16px;box-shadow:var(--shadow)}
.optrow .n{font-size:16px;color:#37424F;font-weight:600}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid #C9CFD6;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--orange)}
.radio.on i{width:12px;height:12px;border-radius:6px;background:var(--orange);display:block}
.switch{width:48px;height:28px;border-radius:14px;background:#D5DAE0;position:relative;cursor:pointer;flex:0 0 48px;transition:background .18s;border:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s;display:block}
.switch.on{background:var(--orange)}
.switch.on i{left:23px}

/* Éxito */
.success{position:relative;text-align:center;padding-top:16px}
.success h2{font-family:var(--font-ui);font-size:24px;font-weight:500;color:var(--navy);
  line-height:1.3;letter-spacing:-.01em;margin:8px 16px 24px}
/* Ilustración de check: 82x82 */
.tick{width:82px;height:82px;border-radius:41px;border:3px solid var(--teal);display:flex;
  align-items:center;justify-content:center;margin:0 auto 24px;color:var(--teal);
  animation:pop .4s cubic-bezier(.2,1.2,.4,1)}

/* ===== Confetti ===== */
/* Cae por detrás del contenido: el confetti se queda en la capa 0
   y la cabecera, el cuerpo y el footer suben a la capa 1. */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.screen>.nav,.screen>.body,.screen>.footer{position:relative;z-index:1}
.confetti b{position:absolute;top:-24px;display:block;opacity:0;
  animation-name:confettiFall;animation-timing-function:cubic-bezier(.35,.15,.6,1);
  animation-fill-mode:forwards;will-change:transform,opacity}
@keyframes confettiFall{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  6%  {opacity:1}
  78% {opacity:1}
  100%{transform:translate3d(var(--dx),var(--dist),0) rotate(var(--rot));opacity:0}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

.qrcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px;text-align:center}
.qrcard .lead{font-size:14.5px;color:var(--ink-2);line-height:1.4}
.qrcard .qt{font-size:17px;font-weight:800;color:var(--navy);margin:16px 0 16px}
.qr{width:170px;height:170px;margin:0 auto 16px;display:grid;background:#fff;padding:8px}
.qr span{background:#111}
.qr span.o{background:transparent}

/* ===== Escáner QR (cámara simulada) ===== */
.screen[data-scan]{background:#0E1216}
.scan-feed{position:absolute;inset:0;overflow:hidden}
.scan-feed .scene{position:absolute;inset:-8%;
  background:radial-gradient(120% 90% at 28% 18%,#46525F 0%,#2B343D 42%,#141A20 100%);
  animation:feedDrift 9s ease-in-out infinite alternate}
.scan-feed .blob{position:absolute;border-radius:40px;filter:blur(18px);opacity:.5}
.scan-feed .grain{position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;
  animation:grain .6s steps(2) infinite}
@keyframes feedDrift{from{transform:scale(1.04) translate(-8px,-4px)}to{transform:scale(1.1) translate(8px,8px)}}
@keyframes grain{from{transform:translate(0,0)}to{transform:translate(-1px,1px)}}
/* Cartelito con el QR que "entra" al encuadre */
.scan-target{position:absolute;left:50%;top:50%;width:160px;
  transform:translate(-50%,-50%) rotate(-7deg) scale(.72);
  background:#fff;border-radius:8px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  animation:targetIn 2.2s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes targetIn{
  0%{transform:translate(-32%,-64%) rotate(-14deg) scale(.5);opacity:.75}
  100%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1}}
.scan-frame{position:absolute;left:50%;top:50%;width:240px;height:240px;
  transform:translate(-50%,-50%);border-radius:24px;
  box-shadow:0 0 0 9999px rgba(10,14,18,.66);transition:box-shadow .3s}
.scan-frame b{position:absolute;width:40px;height:40px;border:4px solid var(--orange);transition:border-color .3s}
.scan-frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.scan-frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.scan-frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.scan-frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.scan-frame i{position:absolute;left:8px;right:8px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  box-shadow:0 0 16px rgba(232,137,11,.8);animation:scanSweep 2.2s ease-in-out infinite}
@keyframes scanSweep{0%,100%{top:8px}50%{top:229px}}
.screen[data-scan="ok"] .scan-frame b{border-color:#22C55E}
.screen[data-scan="ok"] .scan-frame{box-shadow:0 0 0 9999px rgba(10,14,18,.78)}
.scan-ok{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:80px;height:80px;border-radius:40px;background:#22C55E;color:#fff;
  display:flex;align-items:center;justify-content:center;animation:pop .3s cubic-bezier(.2,1.2,.4,1);
  box-shadow:0 8px 32px rgba(34,197,94,.5)}
.scan-nav{position:relative;z-index:2}
.scan-nav h1{color:#fff}
.scan-nav button{color:#fff}
.scan-nav button:active{background:rgba(255,255,255,.16)}
.scan-hint{position:absolute;left:24px;right:24px;top:calc(50% + 160px);z-index:2;text-align:center;
  color:#fff;font-size:16px;font-weight:600;line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.scan-hint span{display:block;margin-top:8px;font-size:13.5px;font-weight:400;opacity:.75}
.scan-actions{position:absolute;left:24px;right:24px;bottom:24px;z-index:2}
.scan-actions .btn-glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px)}

/* ===== Administradores ===== */
.searchbox{position:relative;margin-bottom:24px}
.searchbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--navy);display:flex;pointer-events:none}
.searchbox .inp{padding-left:48px}
.personcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;

button.personcard{cursor:pointer}
button.personcard:active{background:#FAFBFC}

/* ===== Pago externo ===== */
.balrow.tap{cursor:pointer;width:100%;text-align:left}
.balrow.tap:active{background:#FAFBFC}
.optsheet-title{text-align:center;font-family:var(--font-ui);font-size:16px;font-weight:600;

.optitem{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;

  display:flex;align-items:center;justify-content:center;color:var(--navy)}

.membercard{display:flex;align-items:center;gap:16px;background:#fff;border-radius:12px;
  box-shadow:0 2px 10px rgba(16,24,40,.12);padding:16px;text-align:left}

  color:var(--navy);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.counter{text-align:right;font-size:13px;color:var(--muted);margin-top:8px}
.extok{text-align:center;padding-top:56px}
.extok .msg{font-family:var(--font-ui);font-size:19px;font-weight:400;color:#3D4A5C;margin:24px 0}
.extok .method{font-size:16px;color:#7A8593;margin-top:16px}

/* ===== Unirte a un grupo ===== */
.pickrow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;
  transition:border-color .15s,background .15s}
.pickrow.on{border-color:var(--orange);background:var(--field-focus)}
.pickrow .rad{flex:0 0 28px;height:28px;border-radius:14px;border:2px solid var(--orange);
  display:flex;align-items:center;justify-content:center}
.pickrow.on .rad i{display:block;width:16px;height:16px;border-radius:8px;background:var(--orange)}
.pickrow .nm{min-width:0;font-size:16.5px;color:#37424F}
.nolink{display:block;width:100%;background:none;border:0;cursor:pointer;text-align:center;
  font-family:var(--font-ui);font-size:16px;font-weight:700;color:var(--orange);
  padding:16px 0;margin-bottom:8px}
.infobox{display:flex;align-items:center;gap:16px;background:#D8ECFD;border-radius:12px;padding:16px;
  font-size:16px;color:#3B4559;line-height:1.45}
.infobox svg{flex:0 0 auto;color:#00709E}
.join-head{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}

  display:flex;align-items:center;justify-content:center;font-size:24px}

.field .clear{position:absolute;right:16px;top:50%;transform:translateY(-50%);

/* Lista de gastos incluidos al pagar el balance total */
.paylist{background:#fff;border:1px solid var(--line);border-radius:12px;

.prow-pay .t b{display:block;font-size:16px;font-weight:600;color:#37424F;line-height:1.25}
.prow-pay .t i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.prow-pay .m{font-family:var(--font-display);font-size:16px;font-weight:700;color:#37424F;white-space:nowrap}
.paytotal{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:16px;padding:16px;background:var(--sel);border:1px solid #F0E0C6;border-radius:12px}

/* ===== Pantallas de pago (verificación y comprobante) ===== */
.screen[data-pay]{background:linear-gradient(180deg,
  #062E6B 0%, #0A4488 14%, #1A5EA0 26%, #4B84B8 37%, #A8C4DC 47%, #E8EEF4 56%, #fff 64%)}
.screen[data-pay] .nav h1{color:#fff}
.screen[data-pay] .nav button{color:#fff}
.screen[data-pay] .nav button:active{background:rgba(255,255,255,.16)}
.screen[data-pay] .footer{background:transparent}
.pay-actions{margin-top:32px;padding-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Carga de la transacción: overlay oscuro + cuadro blanco con loader gris */

.pay-rows{margin-top:24px}

  padding:16px 0;border-bottom:1px solid #E9ECEF}
.payrow .k{font-size:16px;color:#37424F;font-weight:500;white-space:nowrap}
.payrow .v{font-size:16px;color:#7A8593;text-align:right;line-height:1.5}

/* Modales */
/* Los pop-ups flotan: el scrim aporta el margen para que no toquen los bordes */
.scrim{position:absolute;inset:0;background:rgba(24,28,34,.42);display:flex;align-items:flex-end;
  justify-content:center;z-index:40;animation:fade .2s;padding:24px}
.scrim.center{align-items:center}
.scrim.no-anim,.scrim.no-anim .sheet,.scrim.no-anim .dialog{animation:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:#fff;border-radius:24px;padding:16px 24px 24px;box-shadow:var(--shadow-2);
  animation:up .26s cubic-bezier(.22,.61,.36,1);max-height:100%;overflow-y:auto}

.toast{position:absolute;left:24px;right:24px;bottom:24px;background:#2A3340;color:#fff;padding:16px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow-2);animation:up .2s}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.linkbox{display:flex;align-items:center;gap:8px;background:#F5F6F8;border-radius:10px;padding:16px 16px;font-size:13px;color:var(--ink-2);word-break:break-all;margin-bottom:8px}
.locked{text-align:center;padding:32px 16px}
.locked .ic{width:76px;height:76px;border-radius:38px;background:#FDF3E3;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--orange)}
.note-req{background:var(--sel);border:1px solid #F0E0C6;border-radius:var(--r);padding:16px;margin-bottom:16px}
.note-req .q{font-size:15px;color:#37424F;line-height:1.45;margin-bottom:16px}
.note-req .acts{display:flex;align-items:stretch;justify-content:center;gap:8px}
.note-req .acts button{flex:1 1 148px;max-width:148px;min-width:0;margin-top:0;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);margin-top:-8px;margin-bottom:16px;line-height:1.4}
.expcard{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:16px;cursor:pointer}
.expcard:has(.r){align-items:stretch}
.expcard .info{flex:1;min-width:0}
/* El icono a 32 y siempre centrado, para dejarle sitio al nombre */
.expcard .avatar{flex:0 0 32px;width:32px;height:32px;border-radius:16px;font-size:16px;align-self:center}
.expcard .t{display:block;font-family:var(--font-ui);font-size:18px;font-weight:500;color:#3D4558;line-height:1.3}
.expcard .s{display:block;font-size:14px;color:#3D4558;margin-top:4px}
.expcard .amt{font-family:var(--font-display);font-size:16px;font-weight:400;color:#555555}
.expcard .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;
  gap:8px;align-self:stretch;text-align:right}
.expcard .date{font-size:12.5px;color:var(--muted);white-space:nowrap}
.legend{max-width:340px;font-size:12.5px;color:#6A7686;line-height:1.5;text-align:center}
.legend b{color:var(--navy)}
/* ===== Nombres de persona =====
   Todos los nombres destacados de participantes y usuarios comparten
   el mismo estilo: Neo Sans Std medium 20. */
.personcard .a, .balrow .who .a, .membercard .nm, .reqcard .who .a,
.mrow .nm, .ownercard .nm{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:500;
  line-height:1.2;
}

@media (max-width:430px){
  body{padding:0;background:#fff;align-items:stretch}
  .stage{gap:0;width:100%}
  .brandbar,.legend{display:none}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
}
</style>

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const vp = () => $('#viewport');
/* El signo va delante de la moneda: -RD$400.00, no RD$-400.00 */
function money(n){
  const v = Math.round((Number(n)||0)*100)/100;
  return (v<0 ? '-' : '') + 'RD$' +
    Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Para buscar: sin acentos, sin mayúsculas y sin espacios de sobra.
   Así "maria" encuentra a "María" y "PEREZ" a "Pérez". */
const norm = s => String(s==null?'':s)
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().trim();
const g = id => state.groups.find(x=>x.id===id);
const person = id => PEOPLE[id] || {id, name:id, full:id, short:id};
const nameOf = (id,gr) => id===ME ? person(id).short+' (Yo)' : person(id).short;

/* Un acordeón vacío no se presenta desplegado. Si el usuario ya lo abrió
   o cerró a mano, se respeta su decisión. */
function accOpen(k, n){
  const v = state.accordions[k];
  return (v === undefined || v === null) ? n > 0 : v;
}

/* Balance por integrante: lo que puso − lo que le toca + lo que ya saldó.
   Sin el tercer término un pago no movería el balance y la deuda quedaría viva. */
function balances(gr){
  const b = {}; gr.members.forEach(m=>b[m]=0);
  (gr.expenses||[]).forEach(e=>{
    if(b[e.paidBy]===undefined) b[e.paidBy]=0;
    b[e.paidBy] += e.amount;
    Object.entries(e.split).forEach(([u,v])=>{
      if(b[u]===undefined) b[u]=0;
      b[u] -= v;
      if(u!==e.paidBy && e.paid[u]){        /* ya le pagó su parte a quien adelantó */
        b[u] += v;
        b[e.paidBy] -= v;
      }
    });
  });
  Object.keys(b).forEach(k=>b[k]=Math.round(b[k]*100)/100);
  return b;
}

/* Lo que ese integrante aún debe dentro del grupo */
function owedBy(gr, id){
  if(gr.type==='colecta') return gr.contributions[id] ? 0 : gr.perPerson;
  if(gr.type==='recurrente')
    return round2((gr.periods||[]).filter(p=>!p.paid[id]).reduce((s,p)=>s+(p.split[id]||0),0));
  return round2((gr.expenses||[])
    .filter(e=>e.paidBy!==id && e.split[id] && !e.paid[id])
    .reduce((s,e)=>s+e.split[id],0));
}
/* Lo que YO debo, gasto por gasto */
function myDues(gr){
  if(gr.type==='gastos'){
    return (gr.expenses||[]).filter(e=>e.paidBy!==ME && e.split[ME]>0 && !e.paid[ME])
      .map(e=>({gid:gr.id, id:e.id, title:e.title, amount:e.split[ME], to:e.paidBy, kind:'gasto'}));
  }
  if(gr.type==='colecta'){
    return gr.contributions[ME] ? [] : [{gid:gr.id, id:'colecta', title:'Aporte a '+gr.name, amount:gr.perPerson, to:gr.owner, kind:'colecta'}];
  }
  if(gr.type==='recurrente'){
    return (gr.periods||[]).filter(p=>!p.paid[ME] && p.split[ME]>0)
      .map(p=>({gid:gr.id, id:p.id, title:gr.name+' — '+p.label, amount:p.split[ME], to:gr.owner, kind:'recurrente'}));
  }
  return [];
}

/* ---------- Navegación ---------- */
function go(route, params, opt){
  opt = opt||{};
  if(!opt.replace && !opt.back) state.stack.push({route:state.route, params:state.params, tab:state.tab});
  state.route = route; state.params = params||{}; state.modal=null;
  if(params && params.tab) state.tab = params.tab;
  render(opt.back?'enter-back':(opt.up?'enter-up':'enter'));
}
function back(){
  if(typeof stopScan==='function') stopScan();
  if(state.pay) state.pay.loading = false;      /* cancela un pago en curso */
  const prev = state.stack.pop();
  if(!prev){ state.route='home'; state.params={}; }
  else { state.route=prev.route; state.params=prev.params; state.tab=prev.tab||state.tab; }
  state.modal=null; render('enter-back');
}
function home(){ if(typeof stopScan==='function') stopScan();
  if(state.pay) state.pay.loading = false; state.stack=[]; state.route='home'; state.params={}; state.modal=null; state.persona='admin'; render('enter-back'); }
function openModal(m){ state.modal=m; state.modalShown=false; render(null,true); }
function closeModal(){ state.modal=null; state.modalShown=false; render(null,true); }
function toast(msg){
  state.toast=msg; render(null,true);
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>{ state.toast=null; render(null,true); },2400);
}

/* Confetti minimalista: solo los dos colores de marca y pocas piezas.
   La variación va en el movimiento (giro, deriva, duración), no en la paleta. */
const CONFETTI_COLORS = ['#00709E','#ED8B00'];
function confettiHtml(n){
  n = n || 30;
  let seed = 20260727, out = '';
  const rnd = () => { seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; };
  for(let i=0;i<n;i++){
    const c = CONFETTI_COLORS[i % 2];               /* reparto parejo entre ambos */
    const w = 6 + Math.round(rnd()*2);
    const alto = rnd() > .45 ? w : Math.round(w*2.2);   /* cuadrito o tira */
    const radio = rnd() > .75 ? '50%' : '1px';
    const dur = (2.1 + rnd()*1.6).toFixed(2);
    const delay = (rnd()*1.5).toFixed(2);
    const dx = Math.round((rnd()-.5)*170);
    const dist = 640 + Math.round(rnd()*260);
    const rot = Math.round(360 + rnd()*720) * (rnd()>.5?1:-1);
    out += '<b style="left:'+(rnd()*100).toFixed(2)+'%;width:'+w+'px;height:'+alto+'px'
        + ';background:'+c+';border-radius:'+radio
        + ';animation-duration:'+dur+'s;animation-delay:'+delay+'s'
        + ';--dx:'+dx+'px;--dist:'+dist+'px;--rot:'+rot+'deg"></b>';
  }
  return '<div class="confetti" aria-hidden="true">'+out+'</div>';
}

function shell(o){
  return '<div class="screen"'+(o.pay?' data-pay="1"':'')+'>'
    + (o.overlay || '')
    + '<div class="nav">'
      + (o.leftHtml!==undefined ? o.leftHtml : (o.noBack?'<span></span>':'<button data-a="back" aria-label="Volver">'+I.back+'</button>'))
      + '<h1>'+esc(o.title||'')+'</h1>'
      + (o.right?'<span class="right">'+o.right+'</span>':'<span></span>')
    + '</div>'
    + '<div class="body" id="scrollBody">'+o.body+'</div>'
    + (o.footer?'<div class="footer'+(o.borderFooter?' bordered':'')+'">'+o.footer+'</div>':'')
  + '</div>';
}

  clearTimeout(window.__scanA); clearTimeout(window.__scanB);
  window.__scanA = setTimeout(()=>{ if(state.route==='scan') scanDetect(); }, 2400);
}
function scanDetect(){
  if(state.route!=='scan') return;
  clearTimeout(window.__scanA); clearTimeout(window.__scanB);

    if(state.route!=='scan') return;

/* QR decorativo determinista */
function qrHtml(seed){
  const N=25; let s=0; for(let i=0;i<String(seed).length;i++) s=(s*31+String(seed).charCodeAt(i))>>>0;
  const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  const finder=(r,c)=>{
    const inTL=r<7&&c<7, inTR=r<7&&c>=N-7, inBL=r>=N-7&&c<7;
    if(!(inTL||inTR||inBL)) return null;
    const rr = inBL? r-(N-7) : r, cc = inTR? c-(N-7) : c;
    const ring = (rr===0||rr===6||cc===0||cc===6);
    const core = (rr>=2&&rr<=4&&cc>=2&&cc<=4);
    return ring||core;
  };
  let cells='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const f=finder(r,c);
    const on = f===null ? rnd()>0.52 : f;
    cells += '<span class="'+(on?'':'o')+'"></span>';
  }
  return '<div class="qr" style="grid-template-columns:repeat('+N+',1fr);grid-template-rows:repeat('+N+',1fr)">'+cells+'</div>';
}

          : '<span class="n" style="color:var(--navy)">Seleccionar cuenta</span>')
      + '<span class="chev">'+I.chev+'</span></button>';

const round2 = n => Math.round((Number(n)||0)*100)/100;

/* Reparto del gasto. En "montos personalizados", lo que el usuario fija a mano
   queda intacto y el resto se divide entre los demás. */
function splitAmounts(gr){
  const f = state.form;
  const amt = round2(f.amount);
  const act = gr.members.filter(m => f.who && f.who[m]);
  const res = {};
  if(!act.length) return res;

  const enPartes = (gente, total) => {
    const per = round2(total / gente.length);
    gente.forEach((m,i)=> res[m] = i===gente.length-1 ? round2(total - per*(gente.length-1)) : per);
  };
  if(f.splitMode !== 'montos'){ enPartes(act, amt); return res; }

  const fijos  = act.filter(m => f.locked && f.locked[m]);
  const libres = act.filter(m => !(f.locked && f.locked[m]));
  let usado = 0;
  fijos.forEach(m=>{ res[m] = round2((f.custom||{})[m] || 0); usado += res[m]; });
  if(libres.length) enPartes(libres, Math.max(round2(amt - usado), 0));
  return res;
}
/* Lo que se ve dentro del campo de monto: solo el número, sin "RD$".
   No fuerza decimales para no estorbar mientras se escribe. */
/* Deja solo dígitos y un punto, con dos decimales como máximo */
function sanitizeMoney(v){
  let s = String(v==null?'':v).replace(/[^0-9.]/g,'');
  const i = s.indexOf('.');
  if(i>=0) s = s.slice(0,i+1) + s.slice(i+1).replace(/\./g,'');
  const p = s.split('.');
  if(p[1]!==undefined) s = p[0] + '.' + p[1].slice(0,2);
  return s;
}
function moneyInput(v){
  const s = String(v==null?'':v);
  if(!s) return '';
  const p = s.split('.');
  const ent = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.length>1 ? ent+'.'+p[1] : ent;
}

function scrConfig(){

    +'<span style="color:var(--navy)">'+ic+'</span><span><span class="ttl" style="color:#37424F;font-size:16px">'+t+'</span>'
    +(v?'<span class="txt">'+v+'</span>':'')+'</span></span><span class="chev">'+I.chev+'</span></button>';

        acctOf(gr) ? acctOf(gr).name+' · '+acctOf(gr).num : 'Se elige al crear cada gasto');

    + '<span style="color:var(--navy)">'+I.bell+'</span><span><span class="ttl" style="color:#37424F;font-size:16px">Recordatorios</span>'
    + '<span class="txt">Avisar a los integrantes con pagos pendientes</span></span></span>'
    + '<button class="switch '+(gr.reminders?'on':'')+'" data-a="toggleReminders" data-gid="'+gr.id+'"><i></i></button></div>';

  b += '<button class="accordion'+(abiertoSol?' open':'')+'" data-a="acc" data-k="pendientes" style="margin-top:16px">'
    + '<span class="l">Solicitudes pendientes</span>'
    + '<span class="r"><span class="badge '+(gr.requests.length?'on':'')+'">'+gr.requests.length+'</span>'
    + '<span class="arrow">'+I.down+'</span></span></button>';
  {
    b += '<div class="acc-panel'+(abiertoSol?' open':'')+'" data-acc="pendientes"><div class="inner">'
      + '<div style="padding:16px 0 4px">';
    if(!gr.requests.length) b += '<div class="empty" style="padding:16px">No hay solicitudes.</div>';
    gr.requests.forEach(r=>{
      b += '<div class="note-req"><div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">'
        + '<span class="ava-ic">'+I.avatar+'</span><span><b style="display:block;color:var(--navy);text-transform:uppercase">'+esc(r.userName)+'</b>'
        + '<span class="small muted">'+esc(r.full)+'</span></span></div>'
        + '<div class="q">'+esc(r.userName)+' quiere unirse a “'+esc(gr.name)+'”.</div>'
        + '<div class="acts"><button class="btn btn-soft btn-sm" data-a="rejectReq" data-gid="'+gr.id+'" data-rid="'+r.id+'">Rechazar '+I.close+'</button>'
        + '<button class="btn btn-primary btn-sm" data-a="approveReq" data-gid="'+gr.id+'" data-rid="'+r.id+'">Aceptar '+I.check+'</button></div></div>';
    });
    b += '</div></div></div>';
  }

  /* Miembros */
  const abiertoMiem = accOpen('miembros', gr.members.length);
  b += '<button class="accordion'+(abiertoMiem?' open':'')+'" data-a="acc" data-k="miembros">'
    + '<span class="l">Miembros</span>'
    + '<span class="r"><span class="badge navy">'+gr.members.length+'</span>'
    + '<span class="arrow">'+I.down+'</span></span></button>';
  {
    b += '<div class="acc-panel'+(abiertoMiem?' open':'')+'" data-acc="miembros"><div class="inner">'
      + '<div style="padding:16px 0 4px">';

        + '<b>'+esc(fullOf(m))+'</b></span>'

    });
    b += '</div></div></div>';

  b += '<div class="hr"></div>'
    + '<button class="btn btn-ghost" data-a="shareModal" data-id="'+gr.id+'">Compartir grupo '+I.share+'</button>'
    + '<button class="btn btn-danger" data-a="archiveGroup" data-gid="'+gr.id+'" style="margin-top:8px">'

/* ============================================================
   MODALES
   ============================================================ */
function renderModal(){
  const m = state.modal;
  if(!m) return '';
  /* La animación de entrada solo corre la primera vez que se pinta el modal.
     En actualizaciones internas (elegir un día, restaurar, escribir) se omite,
     si no parecería que se abre otro modal cada vez. */
  const anim = state.modalShown ? ' no-anim' : '';
  state.modalShown = true;
  const sheet = (inner,cls)=>'<div class="scrim'+anim+'" data-a="closeModal"><div class="'+(cls||'sheet')+'" data-stop="1">'+inner+'</div></div>';

  if(m.type==='share'){
    const gr=g(m.gid); const direct=gr.perms.join==='enlace';
    return sheet('<div class="ic-lg">'+I.shareGroupLg+'</div>'
      + '<h3>Compartir grupo</h3>'
      + '<p>Invita a otras personas para que se unan a este grupo</p>'
      + '<div class="qt">Código QR del grupo</div>'
      + qrHtml(gr.id)
      + '<button class="btn btn-primary btn-md" data-a="shareLink">Compartir enlace '+I.share+'</button>'
      + '<div class="dlg-note">'+(direct
          ? 'Las personas invitadas podrán unirse directamente al grupo.'
          : 'Las personas invitadas deberán solicitar acceso al grupo.')+'</div>','dialog');
  }
  if(m.type==='emoji'){
    return sheet('<div class="grab"></div><h3>Elige un emoji</h3><div class="emoji-grid">'
      + EMOJIS.map(e=>'<button data-a="setEmoji" data-v="'+e+'">'+e+'</button>').join('')+'</div>');
  }
  if(m.type==='category'){
    return sheet('<div class="grab"></div><h3>Categoría</h3><div class="cat-grid">'
      + CATEGORIES.map(c=>'<button data-a="setCategory" data-v="'+c.id+'"><span style="font-size:22px">'+c.e+'</span>'+c.n+'</button>').join('')+'</div>');
  }
  if(m.type==='splitmode'){
    return sheet('<div class="grab"></div><h3>División</h3><div class="cat-grid">'
      + '<button data-a="setSplit" data-v="iguales">Partes iguales</button>'
      + '<button data-a="setSplit" data-v="montos">Montos personalizados</button></div>');
  }
  if(m.type==='payer'){
    const gr=g(state.params.gid);
    return sheet('<div class="grab"></div><h3>Pagado por</h3><div class="cat-grid">'
      + gr.members.map(mm=>'<button data-a="setPayer" data-v="'+mm+'">'+esc(nameOf(mm))+'</button>').join('')+'</div>');
  }
  if(m.type==='customName'){
    const v = state.form.joinName || '';
    return sheet('<h3>Ingresar nombre</h3>'
      + '<div class="field" style="text-align:left"><span class="lab">Nombre</span>'
        + '<input class="inp has-lab has-clear" placeholder=" " value="'+esc(v)+'" data-bind="joinName" autocomplete="off">'
        + '<button class="clear" data-a="clearJoinName" aria-label="Borrar">'+I.close+'</button></div>'
      + '<button class="btn btn-primary" data-a="doJoin" data-gid="'+m.gid+'" '
        + (v.trim().length>1?'':'disabled')+' style="margin-top:8px">Unirte al grupo</button>'
      + '<button class="btn btn-soft" data-a="closeModal">No, cancelar</button>','dialog');
  }
  if(m.type==='dayOfMonth'){
    let dias='';
    for(let d=1; d<=31; d++)
      dias += '<button class="'+(state.form.payDay===d?'on':'')+'" data-a="setDayOfMonth" data-v="'+d+'">'+d+'</button>';
    return sheet('<div class="grab"></div><h3 class="cal-title">Selecciona el día de pago</h3>'
      + '<div class="cal-grid" style="margin-top:24px">'+dias+'</div>'
      + '<div class="hint" style="margin-top:16px">El cobro se repetirá ese día de cada mes. '
      + 'En los meses más cortos se cobrará el último día.</div>');
  }
  if(m.type==='date'){
    return sheet('<div class="grab"></div>'+calendarHtml(m.f));
  }
  if(m.type==='confirmAdmin'){
    return sheet('<h3>¿Quieres agregar a este miembro como administrador?</h3>'
      + personCard(m.id, g(m.gid), '', null)
      + '<button class="btn btn-primary" data-a="doAdmin" data-gid="'+m.gid+'" data-id="'+m.id+'" style="margin-top:24px">Sí, continuar</button>'
      + '<button class="btn btn-soft" data-a="closeModal">No, seleccionar otro miembro</button>','dialog');
  }
  /* Opciones del participante tocado en Balances */
  if(m.type==='memberOptions'){
    return sheet('<div class="grab"></div><h3 class="optsheet-title">Opciones</h3>'
      + '<button class="optitem" data-a="openExternal" data-gid="'+m.gid+'" data-id="'+m.id+'">'
        + '<span class="ic">'+I.extPay+'</span>'
        + '<span class="t">Registrar pago externo</span></button>');
  }
  /* Formulario de registro manual */
  if(m.type==='externalForm'){
    const e = state.ext || {};
    const nota = e.note || '';
    return sheet('<div class="ic-lg">'+I.extPay+'</div>'
      + '<h3>Registrar pago externo</h3>'

        + '<span class="amt">'+money(e.amount)+'</span></div>'

      + '<p><b>'+esc(m.who)+'</b> no fue agregado a “'+esc(m.gname)+'”. Puede volver a solicitar acceso con el enlace del grupo.</p>'
      + '<button class="btn btn-primary" data-a="closeModal">De acuerdo</button>','dialog');

  if(m.type==='approved'){
    return sheet('<div class="ic-lg" style="color:var(--teal)">'+I.checkBig+'</div><h3>¡Listo!</h3>'
      + '<p><b>'+esc(m.who)+'</b> ahora forma parte de “'+esc(m.gname)+'”. Le enviamos una confirmación.</p>'
      + '<button class="btn btn-primary" data-a="closeModal">De acuerdo</button>','dialog');

  if(m.type==='confirmArchive'){
    const gr=g(m.gid);

      + '<p>'+(gr.archived?'El grupo volverá a aparecer en tu dashboard.':'“'+esc(gr.name)+'” dejará de aparecer en el dashboard y no se podrán agregar gastos nuevos. Podrás reabrirlo luego.')+'</p>'
      + '<button class="btn btn-primary" data-a="doArchive" data-gid="'+m.gid+'">'+(gr.archived?'Sí, reabrir':'Sí, archivar')+'</button>'
      + '<button class="btn btn-soft" data-a="closeModal">Cancelar</button>','dialog');
  }
  if(m.type==='adjust'){
    const gr=g(m.gid); const p=gr.periods[0];

      + '<p style="margin:0 0 16px;font-size:14px;color:var(--ink-2)">Monto total del período: <b>'+money(gr.amount)+'</b></p>'
      + '<div class="splitbox">'+gr.members.map(mm=>'<div class="splitrow"><span class="nm">'+esc(nameOf(mm))+'</span>'
        + '<input class="splitmini" inputmode="decimal" value="'+(p.split[mm]||0)+'" data-adj="'+mm+'"></div>').join('')+'</div>'
      + '<button class="btn btn-primary" data-a="saveAdjust" data-gid="'+gr.id+'" style="margin-top:16px">Aplicar</button>'
      + '<button class="btn btn-soft" data-a="closeModal">Restaurar</button>');
  }
  return '';
}

/* ---------- Calendario ---------- */
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CAL_TITLES={deadline:'Seleccionar fecha límite', nextDate:'Seleccionar fecha de pago', date:'Seleccionar fecha del gasto'};

/* Fecha de hoy en el formato del prototipo: 27/Jul/2026 */
function todayStr(){
  const d=new Date();
  return d.getDate()+'/'+MONTHS[d.getMonth()]+'/'+d.getFullYear();
}
/* '11/Jul/2026' -> mes y año, para abrir el calendario donde corresponde */
function monthOf(val){
  const i = MONTHS.indexOf(String(val||'').split('/')[1]);
  return i<0 ? new Date().getMonth() : i;
}
function yearOf(val){
  const y = parseInt(String(val||'').split('/')[2],10);
  return isNaN(y) ? new Date().getFullYear() : y;
}
function calendarHtml(field){
  const y = state.calYear==null ? new Date().getFullYear() : state.calYear;
  const mIdx = state.calMonth==null ? new Date().getMonth() : state.calMonth;
  const hoy = todayStr();
  const first = new Date(y,mIdx,1).getDay();               /* 0 = domingo */
  const days = new Date(y,mIdx+1,0).getDate();
  const prevDays = new Date(y,mIdx,0).getDate();
  let cells='';
  for(let i=first-1;i>=0;i--) cells += '<button class="out" disabled tabindex="-1">'+(prevDays-i)+'</button>';
  for(let d=1;d<=days;d++){
    const val = d+'/'+MONTHS[mIdx]+'/'+y;
    const cls = state.calSel===val ? 'on' : (val===hoy ? 'hoy' : '');
    cells += '<button class="'+cls+'" data-a="calPick" data-v="'+val+'">'+d+'</button>';
  }
  const trail = (7 - ((first+days) % 7)) % 7;
  for(let d=1;d<=trail;d++) cells += '<button class="out" disabled tabindex="-1">'+d+'</button>';

  return '<div class="cal-head"><h3 class="cal-title">'+(CAL_TITLES[field]||'Seleccionar fecha')+'</h3>'
      + '<button class="cal-close" data-a="closeModal" aria-label="Cerrar">'+I.close+'</button></div>'
    + '<div class="cal-nav">'
      + '<button data-a="calPrev" aria-label="Mes anterior">'+I.back+'</button>'
      + '<b>'+MONTHS_L[mIdx]+' '+y+'</b>'
      + '<button data-a="calNext" aria-label="Mes siguiente">'+I.fwd+'</button></div>'
    + '<div class="cal-dow">'+['D','L','M','M','J','V','S'].map(d=>'<span>'+d+'</span>').join('')+'</div>'
    + '<div class="cal-grid">'+cells+'</div>'
    + '<div class="cal-actions">'
      + '<button class="btn btn-soft" data-a="calReset">Restaurar</button>'
      + '<button class="btn btn-primary" data-a="calApply" data-f="'+field+'" '+(state.calSel?'':'disabled')+'>Aplicar</button>'
    + '</div>';
}

const ROUTES = {
  home:scrHome, myAccounts:scrMyAccounts, newGroupType:scrNewGroupType,
  newExpenseGroup:scrNewExpenseGroup, newCollecta:scrNewCollecta, newRecurrent:scrNewRecurrent,
  created:scrCreated, group:scrGroup, addExpense:scrAddExpense, expense:scrExpense, period:scrPeriod,
  pay:scrPay, payConfirm:scrPayConfirm, receipt:scrReceipt, externalOk:scrExternalOk,
  config:scrConfig, cfgOptions:scrCfgOptions, cfgAdmins:scrCfgAdmins, addAdmin:scrAddAdmin, cfgAccount:scrCfgAccount,
  selectAccount:scrSelectAccount, join:scrJoin, joinSent:scrJoinSent, joined:scrJoined,
  scan:scrScan, simulate:scrSimulate, archived:scrArchived
};
function render(anim, keepScroll){
  const prevScroll = keepScroll ? (document.getElementById('scrollBody')||{}).scrollTop : 0;
  const modalEl = keepScroll ? document.querySelector('.sheet,.dialog') : null;
  const prevModalScroll = modalEl ? modalEl.scrollTop : 0;
  const fn = ROUTES[state.route] || scrHome;
  let html = fn();
  if(anim) html = html.replace('class="screen"','class="screen '+anim+'"');
  vp().innerHTML = html + renderModal() + (state.toast?'<div class="toast">'+esc(state.toast)+'</div>':'');
  if(keepScroll){
    const sb=document.getElementById('scrollBody'); if(sb) sb.scrollTop=prevScroll;
    if(prevModalScroll){ const m=document.querySelector('.sheet,.dialog'); if(m) m.scrollTop=prevModalScroll; }
  }
  if(state.focusJoin){
    state.focusJoin = null;
    const el = document.querySelector('[data-bind="joinName"]');
    if(el) el.focus();
  }
  if(state.focusId){
    const el = document.querySelector('[data-person="'+state.focusId+'"]');
    state.focusId = null;
    if(el){ el.focus(); if(el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  }
}

/* ---------- Eventos ---------- */
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.bind){
    let v=t.value;
    if(t.dataset.money){
      /* Se limpia el propio campo en el momento: las letras no llegan a verse */
      v = sanitizeMoney(v);
      const agrupado = moneyInput(v);
      if(t.value !== agrupado){
        t.value = agrupado;
        const n = agrupado.length;
        try{ t.setSelectionRange(n,n); }catch(_){}
      }
    }
    state.form[t.dataset.bind]= v;
    /* re-render diferido solo para campos que afectan CTA/cálculos */
    const needs=['name','perPerson','amount','title','joinName','note','extNote','adminQuery'];
    if(needs.includes(t.dataset.bind)){
      clearTimeout(window.__db);
      window.__db=setTimeout(()=>{ const pos=t.selectionStart; render(null,true);
        const el=document.querySelector('[data-bind="'+t.dataset.bind+'"]');
        if(el){ el.focus();
          /* en montos el texto se reformatea, así que el cursor va al final */
          const p = t.dataset.money ? (el.value||'').length : pos;
          try{el.setSelectionRange(p,p);}catch(_){} } },420);
    }
  }
  if(t.dataset.bind==='extNote' && state.ext){ state.ext.note = t.value; }
  if(t.dataset.person){
    const p = (state.form.people||[]).find(x=>x.id===t.dataset.person);
    if(p) p.name = t.value;            /* sin re-render: no cambia nada más en pantalla */
  }
  if(t.dataset.custom){
    /* Al escribir un monto, ese queda fijo y el resto se reparte solo */
    const v = sanitizeMoney(t.value);
    const agrupado = moneyInput(v);
    if(t.value !== agrupado){
      t.value = agrupado;
      const n = agrupado.length;
      try{ t.setSelectionRange(n,n); }catch(_){}
    }
    state.form.custom = state.form.custom||{};
    state.form.locked = state.form.locked||{};
    state.form.custom[t.dataset.custom] = Number(v)||0;
    state.form.locked[t.dataset.custom] = true;
    const quien = t.dataset.custom;
    clearTimeout(window.__dbSplit);
    window.__dbSplit = setTimeout(()=>{
      render(null,true);
      const el = document.querySelector('[data-custom="'+quien+'"]');
      if(el){ el.focus(); const n=(el.value||'').length; try{el.setSelectionRange(n,n);}catch(_){} }
    }, 380);
  }
  if(t.dataset.adj){
    state.__adj = state.__adj||{};
    state.__adj[t.dataset.adj] = Number(t.value)||0;
  }
});

document.addEventListener('focusout', e=>{
  const t = e.target;
  if(!t || !t.dataset) return;

  /* Al terminar de escribir, el monto se normaliza a dos decimales */
  if(t.dataset.money && t.dataset.bind){
    const v = sanitizeMoney(state.form[t.dataset.bind]);
    state.form[t.dataset.bind] = (v === '' || isNaN(Number(v))) ? '' : round2(v).toFixed(2);
    render(null, true);
    return;
  }

  /* Un participante que queda sin nombre se retira, para no acumular
     casillas vacías. La mía nunca se quita. */
  if(t.dataset.person && t.dataset.person !== ME){
    const p = (state.form.people||[]).find(x=>x.id===t.dataset.person);
    if(p && !(p.name||'').trim()){
      state.form.people = state.form.people.filter(x=>x.id!==p.id);
      render(null, true);
    }
  }
});

document.addEventListener('click', e=>{
  /* Escribir dentro de un campo no dispara la acción de la fila que lo contiene */
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-a]');
  if(!el){ return; }
  const a = el.dataset.a;
  /* Clic dentro de la hoja/diálogo: no cerrar el modal por el scrim */
  if(stop && el.contains(stop)) return;
  const d = el.dataset;
  const gid = d.gid || state.params.gid;

  switch(a){
    case 'back': back(); break;
    case 'home': home(); break;
    case 'closeModal': closeModal(); break;
    case 'acc': {
      const cabecera = document.querySelector('.accordion[data-k="'+d.k+'"]');
      const abierto = state.accordions[d.k] = !(cabecera && cabecera.classList.contains('open'));
      /* Sin repintar: repintar recrearía el nodo y la transición no correría */
      const panel = document.querySelector('.acc-panel[data-acc="'+d.k+'"]');
      if(panel && cabecera){ panel.classList.toggle('open', abierto); cabecera.classList.toggle('open', abierto); }
      else render(null,true);
      break; }
    case 'tab': state.tab=d.t; render(null,true); break;
    case 'myAccounts': go('myAccounts'); break;

    /* Crear grupo */
    case 'newGroup': state.form={}; go('newGroupType'); break;
    case 'pickType':
      state.form={type:d.t, people:[{id:ME, name:person(ME).name}], emoji:null, accountId:null,
        frequency:'Mensual', deadline:todayStr(), payDay:null,
        /* La colecta no muestra el campo; las demás arrancan sin categoría */
        category: d.t==='colecta' ? 'regalos' : null};
      go(d.t==='gastos'?'newExpenseGroup':(d.t==='colecta'?'newCollecta':'newRecurrent'));
      break;
    case 'pickEmoji': openModal({type:'emoji'}); break;
    case 'setEmoji': state.form.emoji=d.v; closeModal(); break;
    case 'pickCategory': openModal({type:'category'}); break;
    case 'setCategory':
      state.form.category=d.v;
      if(state.route==='addExpense') state.form.emoji=catOf(d.v).e;
      closeModal(); break;
    case 'pickDayOfMonth': openModal({type:'dayOfMonth'}); break;
    case 'setDayOfMonth': state.form.payDay=parseInt(d.v,10); closeModal(); break;
    case 'pickDate': {
      const cur = state.form[d.f] || todayStr();
      state.calSel = cur; state.calInit = cur;
      state.calMonth = monthOf(cur); state.calYear = yearOf(cur);
      openModal({type:'date', f:d.f}); break; }
    case 'calPrev': {
      let m=(state.calMonth==null?new Date().getMonth():state.calMonth)-1;
      let y=(state.calYear==null?new Date().getFullYear():state.calYear);
      if(m<0){ m=11; y--; }
      state.calMonth=m; state.calYear=y; render(null,true); break; }
    case 'calNext': {
      let m=(state.calMonth==null?new Date().getMonth():state.calMonth)+1;
      let y=(state.calYear==null?new Date().getFullYear():state.calYear);
      if(m>11){ m=0; y++; }
      state.calMonth=m; state.calYear=y; render(null,true); break; }
    case 'calPick': state.calSel=d.v; render(null,true); break;
    case 'calReset':
      state.calSel = state.calInit || todayStr();
      state.calMonth = monthOf(state.calSel); state.calYear = yearOf(state.calSel);
      render(null,true); break;
    case 'calApply': if(state.calSel){ state.form[d.f]=state.calSel; } closeModal(); break;
    case 'addMember': {
      state.form.people = state.form.people || [{id:ME, name:person(ME).name}];
      /* Si ya hay una casilla vacía, no se crea otra: se enfoca esa */
      const vacia = state.form.people.find(p=>p.id!==ME && !(p.name||'').trim());
      if(vacia){ state.focusId = vacia.id; render(null,true); break; }
      const id = uid('u');
      state.form.people.push({id:id, name:''});
      state.focusId = id;
      render(null,true); break; }
    case 'clearMember': {
      const p = (state.form.people||[]).find(x=>x.id===d.id);
      if(p) p.name = '';
      state.focusId = d.id;             /* el cursor se queda en el campo */
      render(null,true); break; }
    case 'pickAccount': go('selectAccount',{for:d.for, gid:state.params.gid}); break;
    case 'setAccount':
      if(d.for==='pay') state.pay.accountId=d.id; else state.form.accountId=d.id;
      back(); break;
    case 'createGroup': createGroup(); break;

    /* Grupo */
    case 'openGroup': state.tab='gastos'; go('group',{gid:d.id}); break;
    case 'openGroupReplace': state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='gastos'; go('group',{gid:d.id},{replace:true}); break;
    case 'openPending': go('group',{gid:d.id}); break;
    case 'config': go('config',{gid:d.id}); break;
    case 'shareModal': openModal({type:'share', gid:d.id}); break;
    case 'shareLink': closeModal(); toast('Enlace copiado al portapapeles'); break;

    /* Gastos */
    case 'addExpense': {
      const gr=g(gid); const who={}; gr.members.forEach(m=>who[m]=true);
      state.form={who:who, paidBy:ME, splitMode:'iguales', date:todayStr(), accountId:null, custom:{}};
      go('addExpense',{gid:gid}); break; }
    case 'toggleWho':
      state.form.who[d.id] = !state.form.who[d.id];
      if(state.form.locked) delete state.form.locked[d.id];   /* deja de contar como fijo */
      render(null,true); break;
    case 'pickPayer': openModal({type:'payer'}); break;
    case 'setPayer': state.form.paidBy=d.v; closeModal(); break;
    case 'pickSplit': openModal({type:'splitmode'}); break;
    case 'setSplit':
      state.form.splitMode=d.v;
      state.form.locked={}; state.form.custom={};   /* empezar el reparto de cero */
      closeModal(); break;
    case 'resetSplit':
      state.form.locked={}; state.form.custom={};
      render(null,true); break;
    case 'saveExpense': saveExpense(gid); break;
    case 'openExpense': go('expense',{gid:d.gid, eid:d.eid}); break;
    case 'openPeriod': go('period',{gid:d.gid, pid:d.pid}); break;
    case 'adjustSplit': state.__adj=null; openModal({type:'adjust', gid:gid}); break;
    case 'saveAdjust': {
      const gr=g(gid); if(state.__adj){ gr.periods.forEach(p=>{ Object.entries(state.__adj).forEach(([m,v])=>{ if(!p.paid[m]) p.split[m]=round2(v); }); }); }
      closeModal(); toast('Montos actualizados'); break; }

    /* Pagos */
    case 'payGroup': {
      const gr=g(d.gid); const items=myDues(gr);
      if(!items.length) break;
      state.pay={items:items, total:round2(items.reduce((s,x)=>s+x.amount,0)),
        multi:items.length>1, accountId:null, motivo:gr.name};
      go('pay'); break; }
    case 'payAll': {
      const items=allDues();
      state.pay={items:items, total:totalDue(), multi:true, accountId:null, motivo:'Grupos de pago — balance total'};
      go('pay'); break; }
    case 'payItem': {
      const gr=g(gid); let item;
      if(d.kind==='gasto'){ const e=gr.expenses.find(x=>x.id===d.id);
        item={gid:gr.id,id:e.id,kind:'gasto',title:e.title,amount:e.split[ME],to:e.paidBy}; }
      else if(d.kind==='colecta'){ item={gid:gr.id,id:'colecta',kind:'colecta',title:'Aporte a '+gr.name,amount:gr.perPerson,to:gr.owner}; }
      else { const p=gr.periods.find(x=>x.id===d.id);
        item={gid:gr.id,id:p.id,kind:'recurrente',title:gr.name+' — '+p.label,amount:p.split[ME],to:gr.owner}; }
      state.pay={items:[item], total:item.amount, accountId:null, motivo:item.title+' ('+gr.name+')'};
      go('pay'); break; }
    case 'payReview':
      state.pay.fecha='8 jul 2026';
      state.pay.ref='PG-'+Math.floor(100000+Math.random()*899999);
      go('payConfirm'); break;
    case 'payDo':
      if(state.pay.loading) break;
      state.pay.loading = true;
      render(null,true);
      clearTimeout(window.__payT);
      window.__payT = setTimeout(()=>{
        if(state.route!=='payConfirm' || !state.pay.loading) return;  /* si salió, no se cobra */
        state.pay.loading = false;
        applyPayment();
        go('receipt',{},{replace:true});
      }, 1900);
      break;
    case 'shareReceipt': toast('Comprobante compartido'); break;
    case 'clearJoinName': state.form.joinName=''; state.focusJoin=true; render(null,true); break;
    case 'payDone': {
      const gid2 = state.pay.items && state.pay.items.length===1 ? state.pay.items[0].gid : null;
      if(gid2){ state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='balances'; go('group',{gid:gid2},{replace:true}); }
      else home();
      break; }

    /* Pago externo */
    case 'memberOptions': openModal({type:'memberOptions', gid:d.gid, id:d.id}); break;
    case 'openExternal': {
      const gr=g(d.gid);
      /* El monto sale de lo que esa persona debe */
      state.ext = {gid:d.gid, memberId:d.id, amount:owedBy(gr, d.id), method:'efectivo', note:''};
      openModal({type:'externalForm'}); break; }
    case 'saveExternal': saveExternal(); break;
    case 'externalDone':
      state.stack=[{route:'home',params:{},tab:'gastos'}]; state.tab='balances';
      go('group',{gid:d.gid},{replace:true}); break;

    /* Configuración */
    case 'cfgAdmins': go('cfgAdmins',{gid:gid}); break;
    case 'goAddAdmin': state.form={adminQuery:''}; go('addAdmin',{gid:d.gid}); break;
    case 'cfgAdd': go('cfgOptions',{gid:gid, kind:'add'}); break;
    case 'cfgJoin': go('cfgOptions',{gid:gid, kind:'join'}); break;
    case 'cfgInvite': go('cfgOptions',{gid:gid, kind:'invite'}); break;
    case 'cfgAccount': go('cfgAccount',{gid:gid}); break;
    case 'setPerm': { const gr=g(gid); gr.perms[d.key]=d.val; render(null,true); toast('Configuración actualizada'); break; }
    case 'setGroupAccount': { const gr=g(gid); gr.accountId=d.id; render(null,true); toast('Cuenta actualizada'); break; }
    case 'toggleReminders': { const gr=g(gid); gr.reminders=!gr.reminders; render(null,true); break; }
    case 'askAdmin': openModal({type:'confirmAdmin', gid:gid, id:d.id}); break;
    case 'doAdmin': { const gr=g(d.gid); if(!gr.admins.includes(d.id)) gr.admins.push(d.id);
      state.modal=null; state.form={adminQuery:''}; back(); toast('Administrador agregado'); break; }
    case 'rmAdmin': { const gr=g(gid); gr.admins=gr.admins.filter(x=>x!==d.id); render(null,true); toast('Administrador removido'); break; }
    case 'archiveGroup': openModal({type:'confirmArchive', gid:gid}); break;
    case 'doArchive': { const gr=g(gid); gr.archived=!gr.archived; closeModal();
      toast(gr.archived?'Grupo archivado':'Grupo reabierto'); if(gr.archived) home(); break; }

    /* Solicitudes: siempre se confirma antes de ejecutar la acción */
    case 'approveReq': openModal({type:'confirmReq', gid:d.gid, rid:d.rid, mode:'accept'}); break;
    case 'rejectReq':  openModal({type:'confirmReq', gid:d.gid, rid:d.rid, mode:'reject'}); break;
    case 'doReq': {
      const gr=g(d.gid); const r=gr.requests.find(x=>x.id===d.rid);
      if(!r){ closeModal(); break; }
      gr.requests=gr.requests.filter(x=>x.id!==d.rid);
      if(d.mode==='accept'){
        let newId = Object.keys(PEOPLE).find(k=>PEOPLE[k].name===r.userName);
        if(!newId){ newId=uid('u'); PEOPLE[newId]={id:newId, name:r.userName, full:r.full, short:r.userName.split(' ')[0]}; }
        if(!gr.members.includes(newId)){
          gr.members.push(newId);
          if(gr.type==='colecta') gr.contributions[newId]=false;
          if(gr.type==='recurrente') gr.periods.forEach(p=>{ p.split[newId]=round2(gr.amount/gr.members.length); p.paid[newId]=false; });
        }
        openModal({type:'approved', who:r.userName, gname:gr.name});
      } else {
        openModal({type:'rejected', who:r.userName, gname:gr.name});
      }
      break; }

    /* Unirse */
    case 'joinQR': state.scan='buscando'; go('scan',{gid:'g1'}); startScan(); break;
    case 'scanNow': scanDetect(); break;
    case 'goArchived': go('archived'); break;
    case 'goSimulate': go('simulate'); break;
    case 'simInvite': state.form={}; go('join',{gid:d.gid||'g1'}); break;
    case 'pickSlot':
      state.form.joinPick = (state.form.joinPick===d.id ? null : d.id);
      state.form.joinName = '';
      render(null,true); break;
    case 'customName':
      state.form.joinPick = null; state.form.joinName = '';
      openModal({type:'customName', gid:gid}); break;
    case 'doJoin': doJoin(d.gid||gid); break;
    default: break;
  }
});

/* ---------- Acciones ---------- */
/* Registra en la agenda los nombres escritos a mano y devuelve los ids de los miembros */
function commitPeople(list){
  const out = [];
  (list||[]).forEach(p=>{
    const isMe = p.id===ME;
    const nm = (p.name||'').trim() || (isMe ? person(ME).name : '');
    if(!nm) return;                       /* se descartan los campos vacíos */
    const short = nm.split(' ')[0];
    PEOPLE[p.id] = {id:p.id, name:nm, short:short, full:(PEOPLE[p.id]&&PEOPLE[p.id].name===nm)
      ? PEOPLE[p.id].full : nm.toUpperCase()};
    out.push(p.id);
  });
  if(!out.includes(ME)) out.unshift(ME);
  return out;
}

/* Próxima ocurrencia de ese día del mes, ajustando los meses cortos */
function nextDateFor(dia){
  const hoy = new Date();
  let y = hoy.getFullYear(), m = hoy.getMonth();
  if(hoy.getDate() >= dia){ m++; if(m>11){ m=0; y++; } }
  const ultimo = new Date(y, m+1, 0).getDate();
  return Math.min(dia, ultimo)+'/'+MONTHS[m]+'/'+y;
}

function createGroup(){
  const f = state.form;
  const id = uid('g');
  const base = {
    id:id, type:f.type, emoji:f.emoji||'🎉', name:f.name.trim(), category:f.category||'otros',
    owner:ME, admins:[ME], members:commitPeople(f.people),
    accountId: f.type==='gastos' ? null : f.accountId,
    archived:false, reminders:true, requests:[],
    perms:{addExpense:'todos', join:'aprobacion', invite:'todos'}
  };
  if(f.type==='gastos'){ base.expenses=[]; }
  if(f.type==='colecta'){
    base.perPerson=round2(f.perPerson); base.deadline=f.deadline;
    base.contributions={}; base.members.forEach(m=>base.contributions[m]=false);
  }
  if(f.type==='recurrente'){
    base.amount=round2(f.amount);
    base.frequency='Mensual';               /* por ahora solo mensual */
    base.payDay=f.payDay;
    base.nextDate=nextDateFor(f.payDay);
    const per = round2(base.amount/base.members.length);
    const split={}, paid={}; base.members.forEach(m=>{split[m]=per; paid[m]=false;});
    const mes = MONTHS_L[MONTHS.indexOf(base.nextDate.split('/')[1])].toLowerCase();
    base.periods=[{id:uid('p'), label:'Mes de '+mes, due:base.nextDate, split:split, paid:paid}];
  }
  state.groups.push(base);
  state.stack=[{route:'home',params:{},tab:'gastos'}];
  go('created',{gid:id},{replace:true, up:true});
}

function saveExpense(gid){
  const gr=g(gid); const f=state.form;
  const amt = round2(f.amount);
  const act = gr.members.filter(m=>f.who[m]);
  const split = splitAmounts(gr);
  const paid = {};
  act.forEach(m=> paid[m] = (m===(f.paidBy||ME)));
  gr.expenses.push({id:uid('e'), title:f.title.trim(), emoji:f.category?catOf(f.category).e:'🧾',
    category:f.category||'otros', amount:amt, paidBy:f.paidBy||ME, date:f.date, split:split, paid:paid});
  state.tab='gastos';
  back();
  toast('Gasto agregado con éxito: “'+f.title.trim()+'”');
}

function applyPayment(){
  (state.pay.items||[]).forEach(it=>{
    const gr=g(it.gid); if(!gr) return;
    if(it.kind==='gasto'){ const e=gr.expenses.find(x=>x.id===it.id); if(e) e.paid[ME]=true; }
    if(it.kind==='colecta'){ gr.contributions[ME]=true; }
    if(it.kind==='recurrente'){ const p=gr.periods.find(x=>x.id===it.id); if(p) p.paid[ME]=true; }
  });
  const a = acct(state.pay.accountId); a.avail = round2(a.avail - state.pay.total);
}

/* Marca como saldado lo que ese participante debía dentro del grupo */
function saveExternal(){
  const e = state.ext; if(!e) return;
  const gr = g(e.gid); if(!gr) return;
  if(gr.type==='colecta'){ gr.contributions[e.memberId] = true; }
  else if(gr.type==='recurrente'){
    const p = gr.periods.find(x=>!x.paid[e.memberId]); if(p) p.paid[e.memberId] = true;
  } else {
    gr.expenses.forEach(x=>{
      if(x.paidBy !== e.memberId && x.split[e.memberId] && !x.paid[e.memberId]) x.paid[e.memberId] = true;
    });
  }
  state.stack = [{route:'home',params:{},tab:'gastos'}];
  state.modal = null;
  go('externalOk', {}, {replace:true, up:true});
}

/* Reclamar un nombre ya creado: hereda su historial dentro del grupo */
function claimSlot(gr, slotId){
  const mover = o => { if(o && o[slotId]!==undefined){ o[ME] = o[slotId]; delete o[slotId]; } };
  gr.members = gr.members.map(m => m===slotId ? ME : m);
  (gr.expenses||[]).forEach(e=>{ if(e.paidBy===slotId) e.paidBy = ME; mover(e.split); mover(e.paid); });
  if(gr.contributions) mover(gr.contributions);
  (gr.periods||[]).forEach(p=>{ mover(p.split); mover(p.paid); });
  gr.admins = gr.admins.map(m => m===slotId ? ME : m);
  gr.unclaimed = (gr.unclaimed||[]).filter(x => x!==slotId);
}

function doJoin(gid){
  const gr=g(gid); const direct = gr.perms.join==='enlace';
  const pick = state.form.joinPick;
  const nm = (state.form.joinName||'').trim();
  if(direct){
    if(pick){ claimSlot(gr, pick); }
    else if(!gr.members.includes(ME)) gr.members.push(ME);
    if(gr.type==='colecta') gr.contributions[ME]=false;
    if(gr.type==='recurrente') gr.periods.forEach(p=>{ if(p.split[ME]==null){ p.split[ME]=round2(gr.amount/(gr.members.length)); p.paid[ME]=false; } });
    state.stack=[{route:'home',params:{},tab:'gastos'}];
    go('joined',{gid:gid},{replace:true, up:true});
  } else {
    const quien = pick ? person(pick).name : nm;
    gr.requests.push({id:uid('r'), userName:quien, full:quien.toUpperCase()});
    state.stack=[{route:'home',params:{},tab:'gastos'}];
    go('joinSent',{gid:gid},{replace:true, up:true});
  }
}

render();
</script>
